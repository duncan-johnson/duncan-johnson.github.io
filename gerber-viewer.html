<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB Gerber Viewer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap');

/* ── Dark theme (default) ── */
:root {
  --bg:#0a0c0f; --panel:#0f1318; --border:#1e2a35;
  --accent:#00d4aa; --accent2:#0080ff; --text:#c8d8e8; --muted:#4a6070;
  --hover-bg:rgba(255,255,255,.04);
  --swatch-border:rgba(255,255,255,.12);
  --statusbar-bg:rgba(10,12,15,.85);
  --zoom-bg:rgba(15,19,24,.92);
  --overlay-dot:rgba(255,255,255,.05);
}
/* ── Light theme ── */
body.light {
  --bg:#f0f2f5; --panel:#ffffff; --border:#d0d8e0;
  --accent:#007a63; --accent2:#0055cc; --text:#1a2430; --muted:#7a8fa0;
  --hover-bg:rgba(0,0,0,.04);
  --swatch-border:rgba(0,0,0,.15);
  --statusbar-bg:rgba(240,242,245,.92);
  --zoom-bg:rgba(255,255,255,.95);
  --overlay-dot:rgba(0,0,0,.06);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .2s,color .2s}
.logo{font-family:'Share Tech Mono',monospace;font-size:1.1rem;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
.logo span{color:var(--accent2)}
.workspace{display:flex;flex:1;overflow:hidden}

/* ── Toolbar ── */
header{display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;transition:background .2s,border-color .2s}
.toolbar{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap;flex:1;min-width:0}
.tb-group{display:flex;align-items:center;gap:.15rem}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 .2rem;flex-shrink:0}
.tb-btn{padding:.28rem .5rem;border:1px solid transparent;background:transparent;color:var(--text);border-radius:4px;font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.04em;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.tb-btn:hover{border-color:var(--border);background:var(--hover-bg)}
.tb-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,.1)}
body.light .tb-btn.active{background:rgba(0,122,99,.1)}
aside{width:255px;min-width:160px;max-width:520px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;position:relative;transition:background .2s,border-color .2s}
.sidebar-resizer{position:absolute;top:0;right:0;width:5px;height:100%;cursor:col-resize;z-index:10;background:transparent;transition:background .15s}
.sidebar-resizer:hover,.sidebar-resizer.dragging{background:var(--accent)}

.drop-zone{margin:.7rem;border:2px dashed var(--border);border-radius:6px;padding:1rem .8rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;flex-shrink:0}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(0,212,170,.06)}
body.light .drop-zone:hover,body.light .drop-zone.drag-over{background:rgba(0,122,99,.06)}
.drop-zone .dz-icon{font-size:1.8rem;margin-bottom:.3rem}
.drop-zone p{font-size:.75rem;color:var(--muted);line-height:1.5}
.drop-zone strong{color:var(--text)}
#file-input{display:none}
.sec-label{padding:.35rem .8rem .25rem;font-size:.6rem;font-family:'Share Tech Mono',monospace;color:var(--muted);letter-spacing:.18em;border-top:1px solid var(--border);flex-shrink:0}
.layer-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:.3rem .4rem}
.layer-list::-webkit-scrollbar{width:3px}
.layer-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Layer items with drag handle ── */
.layer-item{display:flex;align-items:center;gap:.4rem;padding:.3rem .4rem;border-radius:4px;user-select:none;transition:background .12s,opacity .15s;position:relative;cursor:pointer}
.layer-item:hover{background:var(--hover-bg)}
.layer-item.layer-selected{background:rgba(0,212,170,.13);box-shadow:inset 2px 0 0 var(--accent)}
body.light .layer-item.layer-selected{background:rgba(0,122,99,.1);box-shadow:inset 2px 0 0 var(--accent)}
.layer-item.drag-over-top{box-shadow:0 -2px 0 var(--accent)}
.layer-item.drag-over-bot{box-shadow:0 2px 0 var(--accent)}
.layer-item.dragging-self{opacity:.35}
.drag-handle{font-size:.75rem;color:var(--muted);cursor:grab;flex-shrink:0;padding:0 2px;line-height:1;opacity:.5;transition:opacity .15s}
.drag-handle:hover{opacity:1}
.drag-handle:active{cursor:grabbing}
.swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0;border:1px solid var(--swatch-border);cursor:pointer;transition:transform .15s,box-shadow .15s}
.swatch:hover{transform:scale(1.3);box-shadow:0 0 0 2px var(--accent)}
.lname{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lext{font-size:.62rem;font-weight:700;letter-spacing:.04em;color:var(--text);opacity:.6;flex-shrink:0;background:var(--border);border-radius:3px;padding:1px 4px;font-family:'Share Tech Mono',monospace}
.ldirty{font-size:.72rem;color:var(--warn);flex-shrink:0;line-height:1;opacity:.9}
.leye{margin-left:2px;font-size:.8rem;cursor:pointer;flex-shrink:0;opacity:.8;transition:opacity .15s}
.leye:hover{opacity:1}
.leye.off{opacity:.25}

/* btn and btn-row kept for any remaining uses */
.btn-row{display:flex;gap:.35rem}
.btn{flex:1;padding:.32rem .4rem;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:4px;font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,.1)}
body.light .btn.active{background:rgba(0,122,99,.1)}

main{flex:1;position:relative;overflow:hidden;background:var(--bg);transition:background .2s}
#pcb-canvas{position:absolute;top:0;left:0;cursor:grab;display:block}
#pcb-canvas:active{cursor:grabbing}
.overlay{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--overlay-dot) 1px,transparent 1px);background-size:22px 22px}
.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;color:var(--muted);pointer-events:none}
.empty-state .ei{font-size:3.5rem;opacity:.25}
.empty-state p{font-size:.85rem;letter-spacing:.1em}
.empty-state small{font-family:'Share Tech Mono',monospace;font-size:.65rem;opacity:.45}
.statusbar{position:absolute;bottom:0;left:0;right:0;padding:.28rem 1rem;background:var(--statusbar-bg);border-top:1px solid var(--border);font-family:'Share Tech Mono',monospace;font-size:.65rem;color:var(--muted);display:flex;gap:1.5rem;pointer-events:none;backdrop-filter:blur(4px)}
.statusbar span{color:var(--text)}
.zoom-badge{position:absolute;top:.7rem;right:.7rem;background:var(--zoom-bg);border:1px solid var(--border);border-radius:4px;padding:.25rem .55rem;font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--accent);pointer-events:none}
#sel-rect{position:absolute;pointer-events:none;border:2px solid var(--accent);background:rgba(0,212,170,.08);display:none;box-sizing:border-box}
.meas-label{position:absolute;background:rgba(20,30,40,.92);color:#fff;font-family:'Share Tech Mono',monospace;font-size:.68rem;padding:2px 6px;border-radius:3px;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.15);transform:translate(-50%,-130%)}
body.light .meas-label{background:rgba(255,255,255,.95);color:#1a2430;border:1px solid rgba(0,0,0,.2)}
.toast{position:absolute;top:.8rem;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--panel);border:1px solid var(--accent);color:var(--accent);padding:.35rem .9rem;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:.72rem;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.dbg{position:absolute;top:2.5rem;left:.5rem;background:rgba(0,0,0,.7);color:#0f0;font-family:monospace;font-size:.6rem;padding:.3rem .5rem;border-radius:3px;pointer-events:none;white-space:pre;display:none}
</style>
</head>
<body class="light">
<header>
  <div class="logo">PCB<span>&gt;</span>VIEW</div>

  <div class="toolbar">
    <!-- File group -->
    <div class="tb-group">
      <button class="tb-btn" id="open-btn"    title="Open files">📂 Open</button>
      <button class="tb-btn" id="clear-btn"   title="Clear all layers">✕ Clear</button>
      <button class="tb-btn" id="export-btn"  title="Export PNG">↓ PNG</button>
      <button class="tb-btn" id="save-btn"    title="Save edited layers as Gerber files">💾 Save Layers</button>
    </div>
    <div class="tb-sep"></div>
    <!-- View group -->
    <div class="tb-group">
      <button class="tb-btn" id="fit-btn"      title="Fit board to view">⊡ Fit</button>
      <button class="tb-btn" id="zoom-in-btn"  title="Zoom in">＋</button>
      <button class="tb-btn" id="zoom-out-btn" title="Zoom out">－</button>
      <button class="tb-btn" id="zoom-sel-btn" title="Zoom to selection rectangle">⬚ Zoom Sel</button>
    </div>
    <div class="tb-sep"></div>
    <!-- Tools group -->
    <div class="tb-group">
      <button class="tb-btn" id="measure-btn"  title="Measurement tool">📐 Measure</button>
      <button class="tb-btn" id="obj-sel-btn"  title="Select objects on active layer">⬡ Select</button>
    </div>
    <div class="tb-sep"></div>
    <!-- Edit group -->
    <div class="tb-group">
      <button class="tb-btn" id="copy-btn"  title="Copy selected (Ctrl+C)">⎘ Copy</button>
      <button class="tb-btn" id="cut-btn"   title="Cut selected (Ctrl+X)">✂ Cut</button>
      <button class="tb-btn" id="paste-btn" title="Paste to active layer (Ctrl+V)">⎙ Paste</button>
    </div>
    <div class="tb-sep"></div>
    <!-- Background group -->
    <div class="tb-group" id="bg-btns">
      <button class="tb-btn"        data-bg="#0a0c10" data-theme="dark"  title="Dark background">◼ Dark</button>
      <button class="tb-btn"        data-bg="#183020" data-theme="dark"  title="PCB green background">◼ PCB</button>
      <button class="tb-btn active" data-bg="#e8f0ec" data-theme="light" title="Light background">◻ Light</button>
    </div>
    <div class="tb-sep"></div>
    <!-- Opacity -->
    <div class="tb-group" style="align-items:center;gap:.4rem">
      <span style="font-size:.65rem;color:var(--muted);white-space:nowrap">Opacity</span>
      <input type="range" id="op-slider" min="10" max="100" value="100" style="width:80px;height:3px;accent-color:var(--accent);cursor:pointer">
      <span id="op-val" style="font-size:.65rem;color:var(--muted);min-width:2.5rem">100%</span>
    </div>
  </div>

  <div style="font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.08em;opacity:.7;white-space:nowrap;margin-left:auto">Duncan Johnson</div>
</header>
<div class="workspace">
  <aside id="sidebar">
    <div class="sidebar-resizer" id="sidebar-resizer"></div>
    <div class="drop-zone" id="drop-zone">
      <div class="dz-icon">📂</div>
      <p><strong>Drop Gerber files here</strong><br>or click to browse<br><span style="font-size:.65rem;opacity:.6">.gtl .gbl .gts .gbs .gto .gbo .gko .drl …</span></p>
    </div>
    <input type="file" id="file-input" multiple>
    <div class="sec-label">LAYERS</div>
    <div class="layer-list" id="layer-list">
      <div style="font-size:.68rem;color:var(--muted);padding:.5rem;font-family:'Share Tech Mono',monospace;text-align:center">No layers loaded</div>
    </div>
  </aside>
  <main id="main-view">
    <canvas id="pcb-canvas"></canvas>
    <canvas id="meas-canvas" style="position:absolute;top:0;left:0;pointer-events:none;display:block"></canvas>
    <div class="overlay"></div>
    <div id="sel-rect"></div>
    <div class="empty-state" id="empty-state">
      <div class="ei">⬡</div>
      <p>LOAD GERBER FILES TO BEGIN</p>
      <small>Supports RS-274X extended Gerber · Excellon drill</small>
    </div>
    <div class="zoom-badge" id="zoom-badge">1.0×</div>
    <div class="statusbar">
      XY: <span id="s-xy">—</span> &nbsp;|&nbsp;
      Zoom: <span id="s-zoom">1.00×</span> &nbsp;|&nbsp;
      Layers: <span id="s-layers">0</span> &nbsp;|&nbsp;
      Board: <span id="s-bounds">—</span>
    </div>
    <div class="toast" id="toast"></div>
    <div class="dbg" id="dbg"></div>
  </main>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
//  Layer metadata
//  `order` controls both the sidebar list position (low = top of list = rendered last = visually on top)
//  and the canvas render order (higher order number = drawn later = on top).
//
//  Requested stack (top of sidebar → bottom of sidebar, top rendered last):
//   1  .gtp   Paste Top
//   2  .gts   Soldermask Top
//   3  .gto   Silkscreen Top
//   4  .gtl   Copper Top
//   5  .gp1…  Inner Planes (numbered)
//   6  .gbl   Copper Bottom
//   7  .gbo   Silkscreen Bottom
//   8  .gbs   Soldermask Bottom
//   9  .gbp   Paste Bottom
//  10  .gd1   Drill Drawing
//  11  .gg1   Netlist
//  12  .gko   Board Outline
//  13  .gm1…  Mechanical layers (numbered)
//  14  .gpt   Pad Top
//  15  .gpb   Pad Bottom
// ─────────────────────────────────────────────────────────────────────────────

// Base order table for known fixed extensions.
// Inner planes (.gpN) and mechanical (.gmN) are handled dynamically below.
const LAYER_META = {
  gtp: { label:'Paste Top',          color:'#aaccff', order: 100 },
  gts: { label:'Soldermask Top',     color:'#9933ee', order: 200 },
  gto: { label:'Silkscreen Top',     color:'#f5f5dc', order: 300 },
  gtl: { label:'Copper Top',         color:'#c87941', order: 400 },
  // .gpN inner planes: order 500 + N*10  (handled in getLayerMeta)
  gbl: { label:'Copper Bottom',      color:'#d4943a', order: 600 },
  gbo: { label:'Silkscreen Bottom',  color:'#aaaaaa', order: 700 },
  gbs: { label:'Soldermask Bottom',  color:'#7722cc', order: 800 },
  gbp: { label:'Paste Bottom',       color:'#88aadd', order: 900 },
  gd1: { label:'Drill Drawing',      color:'#00bbcc', order:1000 },
  gg1: { label:'Netlist',            color:'#44cc88', order:1100 },
  gko: { label:'Board Outline',      color:'#ffff00', order:1200 },
  // .gmN mechanical: order 1300 + N*10  (handled in getLayerMeta)
  gpt: { label:'Pad Top',            color:'#ffcc44', order:1500 },
  gpb: { label:'Pad Bottom',         color:'#ff9922', order:1600 },
  // Drill files
  drl: { label:'Drill',              color:'#00ccff', order:1700 },
  xln: { label:'Excellon Drill',     color:'#00ddff', order:1710 },
  // Generic fallbacks
  gbr: { label:'Gerber',             color:'#88aacc', order:1800 },
  ger: { label:'Gerber',             color:'#88aacc', order:1810 },
};

function getLayerMeta(ext) {
  const key = ext.toLowerCase();

  // Known fixed layer
  if (LAYER_META[key]) return { ...LAYER_META[key] };

  // Inner copper planes: .gp1, .gp2, .gp3 …
  const planeM = key.match(/^gp(\d+)$/);
  if (planeM) {
    const n = parseInt(planeM[1], 10);
    return { label:`Inner Plane ${n}`, color:'#b8860b', order: 500 + n * 10 };
  }

  // Mechanical layers: .gm1, .gm2 …
  const mechM = key.match(/^gm(\d+)$/);
  if (mechM) {
    const n = parseInt(mechM[1], 10);
    const mechColors = ['#ff6600','#ff8800','#ffaa00','#ffcc00','#ddaa00'];
    return { label:`Mech ${n}`, color: mechColors[(n-1) % mechColors.length], order: 1300 + n * 10 };
  }

  // Drill drawing variants: .gd2, .gd3 …
  const drillDwgM = key.match(/^gd(\d+)$/);
  if (drillDwgM) {
    const n = parseInt(drillDwgM[1], 10);
    return { label:`Drill Drawing ${n}`, color:'#00bbcc', order: 1000 + n * 10 };
  }

  return { label: ext.toUpperCase(), color:'#888888', order: 1900 };
}

// ─────────────────────────────────────────────────────────────────────────────
//  Gerber RS-274X parser
//  Returns { primitives, bounds }
// ─────────────────────────────────────────────────────────────────────────────
function parseGerber(src) {
  // ── state
  let apertures   = {};
  let curAp       = null;
  let X = 0, Y = 0;
  let unit        = 'MM';
  let fmtXi = 2, fmtXd = 5, fmtYi = 2, fmtYd = 5;
  let interpolation = 'L';   // L CW CCW
  let quadrant      = 'S';   // S M
  let regionMode    = false;
  let regionPath    = [];
  let polarity      = 'D';   // D=dark C=clear

  const primitives = [];
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;

  function expand(raw, intDigits, decDigits) {
    if (raw === undefined || raw === '') return 0;
    const neg = raw[0] === '-';
    const digits = raw.replace(/^[+-]/, '');
    const total = intDigits + decDigits;
    // Gerber: leading zeros suppressed (most common) → pad on the LEFT
    const padded = digits.padStart(total, '0');
    const intPart  = padded.slice(0, intDigits)  || '0';
    const fracPart = padded.slice(intDigits);
    const val = parseFloat(intPart + '.' + fracPart);
    return neg ? -val : val;
  }
  function expandX(raw) { return expand(raw, fmtXi, fmtXd); }
  function expandY(raw) { return expand(raw, fmtYi, fmtYd); }

  function extendBounds(x, y, r) {
    r = r || 0;
    minX = Math.min(minX, x-r); minY = Math.min(minY, y-r);
    maxX = Math.max(maxX, x+r); maxY = Math.max(maxY, y+r);
  }

  // ── aperture definition parser
  function parseAD(body) {
    // e.g.  D10C,0.254    D11R,1.0X0.5X0.2    D12O,0.5X0.3    D13P,1.0X6X0.0
    //       D103THD103    (macro reference)
    const m = body.match(/^D(\d+)([A-Z_][A-Z0-9_]*),?(.*)$/i);
    if (!m) return;
    const id     = parseInt(m[1], 10);
    const type   = m[2].toUpperCase();
    const params = m[3] ? m[3].split('X').map(Number) : [];

    // Check if this is a macro reference
    const macroPrims = macros[m[2]] || macros[type];
    if (macroPrims) {
      // Resolve macro to a bounding-box rectangle.
      // Altium pre-rotates all primitive coordinates into the macro body,
      // so computing the union bounding box across all primitives gives the
      // correct final w×h regardless of pad rotation.
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      let hasGeom=false;

      for (const prim of macroPrims) {
        const { code, nums } = prim;

        if (code === 7) {
          // Thermal relief: x, y, outer_dia, inner_dia, gap, rot
          apertures[id] = { type:'THERMAL', params:[nums[2], nums[3], nums[4], nums[5]] };
          return;
        }

        if (code === 21) {
          // Rectangle: exposure, w, h, cx, cy, rot
          const w=nums[1], h=nums[2], cx=nums[3]||0, cy=nums[4]||0;
          const rot=(nums[5]||0)*Math.PI/180;
          const cos=Math.cos(rot), sin=Math.sin(rot);
          for (const [lx,ly] of [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]]) {
            const rx = cx + lx*cos - ly*sin;
            const ry = cy + lx*sin + ly*cos;
            minX=Math.min(minX,rx); maxX=Math.max(maxX,rx);
            minY=Math.min(minY,ry); maxY=Math.max(maxY,ry);
            hasGeom=true;
          }
        } else if (code === 1) {
          // Circle: exposure, dia, cx, cy
          const r=nums[1]/2, cx=nums[2]||0, cy=nums[3]||0;
          minX=Math.min(minX,cx-r); maxX=Math.max(maxX,cx+r);
          minY=Math.min(minY,cy-r); maxY=Math.max(maxY,cy+r);
          hasGeom=true;
        } else if (code === 20) {
          // Vector line: exposure, w, x1, y1, x2, y2, rot
          const r=nums[1]/2;
          minX=Math.min(minX,nums[2]-r,nums[4]-r); maxX=Math.max(maxX,nums[2]+r,nums[4]+r);
          minY=Math.min(minY,nums[3]-r,nums[5]-r); maxY=Math.max(maxY,nums[3]+r,nums[5]+r);
          hasGeom=true;
        } else if (code === 5) {
          // Polygon: exposure, vertices, x, y, dia, rot
          const r=(nums[4]||0)/2, cx=nums[2]||0, cy=nums[3]||0;
          minX=Math.min(minX,cx-r); maxX=Math.max(maxX,cx+r);
          minY=Math.min(minY,cy-r); maxY=Math.max(maxY,cy+r);
          hasGeom=true;
        } else if (code === 6) {
          // Moire: x, y, outer_dia, ...
          const r=(nums[2]||0)/2, cx=nums[0]||0, cy=nums[1]||0;
          minX=Math.min(minX,cx-r); maxX=Math.max(maxX,cx+r);
          minY=Math.min(minY,cy-r); maxY=Math.max(maxY,cy+r);
          hasGeom=true;
        }
      }

      if (hasGeom) {
        const w = maxX - minX, h = maxY - minY;
        const offX = (minX+maxX)/2, offY = (minY+maxY)/2;
        // Derive corner radius from the smallest circle primitive in the macro.
        // In a ROUNDEDRECT macro, 4 small circles sit at the corners — their radius
        // IS the corner radius. Fall back to 10% of the short side if no circles found.
        let cornerR = null;
        for (const {code, nums} of macroPrims) {
          if (code === 1) {
            const r = nums[1] / 2;
            if (cornerR === null || r < cornerR) cornerR = r;
          }
        }
        if (cornerR === null) cornerR = Math.min(w, h) * 0.10;
        // params: [w, h, offX, offY, cornerRadius]
        apertures[id] = { type:'O', params:[w, h, offX, offY, cornerR] };
      } else {
        apertures[id] = { type:'C', params:[0.5] };
      }
      return;
    }

    apertures[id] = { type, params };
  }

  // ── draw operations
  function opFlash(fx, fy) {
    const ap = apertures[curAp];
    if (!ap) return;
    primitives.push({ kind:'flash', x:fx, y:fy, ap, polarity });
    const r = (ap.params[0] || 0.1) / 2;
    extendBounds(fx, fy, r);
  }

  function opDraw(x2, y2, I, J) {
    const x1 = X, y1 = Y;
    const ap = apertures[curAp] || { type:'C', params:[0.05] };
    const w  = ap.params[0] || 0.05;
    const r  = w / 2;

    if (regionMode) {
      if (interpolation === 'L') {
        if (!regionPath.length) regionPath.push({x:x1,y:y1});
        regionPath.push({x:x2,y:y2});
      } else {
        const segs = arcSegs(x1,y1,x2,y2,I,J, interpolation==='CW');
        if (!regionPath.length) regionPath.push({x:x1,y:y1});
        segs.forEach(s => regionPath.push(s));
      }
      return;
    }

    if (interpolation === 'L') {
      primitives.push({ kind:'line', x1, y1, x2, y2, w, polarity });
      extendBounds(x1,y1,r); extendBounds(x2,y2,r);
    } else {
      const cx = x1+I, cy = y1+J;
      const rad = Math.hypot(x1-cx, y1-cy);
      primitives.push({ kind:'arc', x1,y1,x2,y2,cx,cy,rad, cw:interpolation==='CW', w, polarity });
      extendBounds(cx,cy,rad+r);
    }
  }

  function arcSegs(x1,y1,x2,y2,I,J,cw) {
    const cx=x1+I, cy=y1+J;
    const r=Math.hypot(I,J)||Math.hypot(x2-cx,y2-cy)||1e-6;
    const dx=x2-x1, dy=y2-y1;
    const fullCircle = dx*dx+dy*dy < 1e-10;
    let a1=Math.atan2(y1-cy, x1-cx);
    let a2 = fullCircle ? a1 + (cw ? -2*Math.PI : 2*Math.PI)
                        : Math.atan2(y2-cy, x2-cx);
    if (!fullCircle) {
      if ( cw && a2 > a1) a2 -= 2*Math.PI;
      if (!cw && a2 < a1) a2 += 2*Math.PI;
    }
    const n=Math.max(8, Math.ceil(Math.abs(a2-a1)*16));
    const pts=[];
    for(let k=1;k<=n;k++){const a=a1+(a2-a1)*k/n; pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}
    return pts;
  }

  function closeRegion() {
    if (regionPath.length > 2) {
      primitives.push({ kind:'region', path:[...regionPath], polarity });
      regionPath.forEach(p => extendBounds(p.x,p.y,0));
    }
    regionPath = [];
  }

  // ── tokenise: split on * but keep % blocks together
  const text = src.replace(/\r\n?/g,'\n');

  // Process extended params (%...%) first, then data blocks
  // We'll walk character by character through the stream
  let i=0, len=text.length;
  let macros = {};      // macroName → array of parsed primitives
  let amName  = null;   // currently being parsed macro name
  let amLines = [];     // lines of current macro body

  function finishMacro() {
    if (!amName) return;
    // Parse macro primitives from amLines
    const prims = [];
    for (const line of amLines) {
      const parts = line.split(',').map(s => s.trim());
      const code = parseInt(parts[0], 10);
      const nums = parts.slice(1).map(Number);
      prims.push({ code, nums });
    }
    macros[amName] = prims;
    amName = null; amLines = [];
  }

  function skipWS() { while(i<len && (text[i]===' '||text[i]==='\n'||text[i]==='\t')) i++; }
  function readUntil(ch) {
    let s=''; while(i<len && text[i]!==ch) s+=text[i++]; return s;
  }

  while(i<len) {
    skipWS();
    if(i>=len) break;
    const c=text[i];

    // ── Extended param block  %...%
    if(c==='%') {
      i++; // skip %
      // read until matching %
      const body = readUntil('%');
      if(i<len) i++; // skip closing %
      // body may contain multiple param blocks separated by *
      const parts = body.split('*').map(s=>s.trim()).filter(Boolean);
      for(const part of parts) {
        if(part.startsWith('FS')) {
          // FSLAX25Y25 or FSLAX46Y46 etc.
          const m = part.match(/FS[LT][AI]?X(\d)(\d)Y(\d)(\d)/i);
          if(m){ fmtXi=+m[1]; fmtXd=+m[2]; fmtYi=+m[3]; fmtYd=+m[4]; }
        } else if(part.startsWith('MO')) {
          unit = part.slice(2,4).toUpperCase()==='IN'?'IN':'MM';
        } else if(part.startsWith('LP')) {
          polarity = part[2]==='C'?'C':'D';
        } else if(part.startsWith('AD')) {
          parseAD(part.slice(2));
        } else if(part.startsWith('AM')) {
          // Aperture Macro definition: AMname*  primitive_line* ... (ends at closing %)
          // The name is on the AM line; subsequent *-terminated lines are primitive bodies
          finishMacro();
          amName = part.slice(2).trim();
          amLines = [];
        } else if(amName && part.match(/^\d/)) {
          // Numeric line = macro primitive body
          amLines.push(part);
        }
      }
      finishMacro(); // close any open macro at end of % block
      continue;
    }

    // ── Data block: read until *
    const block = readUntil('*').trim();
    if(i<len && text[i]==='*') i++; // consume *
    if(!block) continue;

    // G04 comment
    if(block.startsWith('G04') || block.startsWith('G4')) continue;
    // End of file
    if(block==='M02'||block==='M00'||block==='M2'||block==='M0') break;

    // Region mode
    if(block==='G36'){ regionMode=true; regionPath=[]; continue; }
    if(block==='G37'){ closeRegion(); regionMode=false; continue; }

    // Units (legacy)
    if(block==='G70'){ unit='IN'; continue; }
    if(block==='G71'){ unit='MM'; continue; }

    // Quadrant mode
    if(block==='G74'){ quadrant='S'; continue; }
    if(block==='G75'){ quadrant='M'; continue; }

    // Extract G code if present (may be combined with coordinates)
    const gm = block.match(/^G0*([0-9]+)/);
    if(gm) {
      const g=parseInt(gm[1],10);
      if(g===1) interpolation='L';
      else if(g===2) interpolation='CW';
      else if(g===3) interpolation='CCW';
      else if(g===36){ regionMode=true; regionPath=[]; continue; }
      else if(g===37){ closeRegion(); regionMode=false; continue; }
      else if(g===70){ unit='IN'; continue; }
      else if(g===71){ unit='MM'; continue; }
      else if(g===74){ quadrant='S'; continue; }
      else if(g===75){ quadrant='M'; continue; }
      // If pure G code with no coord, stop
      if(!block.match(/[XYDIJ]/)) continue;
    }

    // Aperture select  Dnn (nn>=10) — must NOT match D01/D02/D03 operation codes
    const aps = block.match(/^D(\d+)$/);
    if(aps){ const id=parseInt(aps[1],10); if(id>=10){ curAp=id; continue; } }

    // Coordinate + D code
    // Pattern: optional G, then optional X, Y, I, J, then D01/02/03
    const cm = block.match(/(?:G0*[0-9]+)?(?:X([+-]?\d+))?(?:Y([+-]?\d+))?(?:I([+-]?\d+))?(?:J([+-]?\d+))?D0*(1|2|3)$/);
    if(cm) {
      const nx = cm[1]!==undefined ? expandX(cm[1]) : X;
      const ny = cm[2]!==undefined ? expandY(cm[2]) : Y;
      const I  = cm[3]!==undefined ? expandX(cm[3]) : 0;
      const J  = cm[4]!==undefined ? expandY(cm[4]) : 0;
      const d  = parseInt(cm[5],10);
      if(d===2) { X=nx; Y=ny; }                  // move
      else if(d===1) { opDraw(nx,ny,I,J); X=nx; Y=ny; }  // draw
      else if(d===3) { opFlash(nx,ny);    X=nx; Y=ny; }  // flash
      continue;
    }
  }

  if(minX===Infinity) { minX=0; minY=0; maxX=100; maxY=100; }
  return { primitives, bounds:{minX,minY,maxX,maxY} };
}

// ─────────────────────────────────────────────────────────────────────────────
//  Excellon drill parser (simplified)
// ─────────────────────────────────────────────────────────────────────────────
function parseExcellon(src) {
  const lines = src.split(/\r?\n/);
  const primitives = [];
  let tools={}, curTool=null, unit='IN', metric=false;
  let fmtXd=4, header=true;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;

  function parseCoord(s, nd) {
    if(!s) return 0;
    const neg=s[0]==='-';
    const d=s.replace(/^-/,'');
    if(d.includes('.')) return (neg?-1:1)*parseFloat(d)*(metric?1:25.4);
    // trailing zero suppressed: pad right
    const padded = d.padEnd(Math.max(d.length, nd+1),'0');
    const intP = padded.slice(0, -nd)||'0';
    const frP  = padded.slice(-nd);
    return (neg?-1:1)*parseFloat(intP+'.'+frP)*(metric?1:25.4);
  }

  for(const raw of lines) {
    const line=raw.trim();
    if(!line||line.startsWith(';')) continue;
    if(line==='M48'){ header=true; continue; }
    if(line==='%'||line==='M95'){ header=false; continue; }
    if(line==='M30'||line==='M00'||line==='M02') break;

    if(line==='METRIC'||line.startsWith('METRIC,')){ metric=true; unit='MM'; continue; }
    if(line==='INCH'||line.startsWith('INCH,')){ metric=false; unit='IN'; continue; }

    // Format hint
    const fmtm = line.match(/FMAT,V(\d)/); // ignore
    const lzm  = line.match(/^(LZ|TZ)/);   // leading/trailing zeros – simplified

    // Tool definition
    const td = line.match(/^T(\d+)(?:C([0-9.]+))?(?:F\d+)?(?:S\d+)?(?:B\d+)?(?:H\d+)?/);
    if(td && header && td[2]){ tools[td[1]]={dia:parseFloat(td[2])}; continue; }
    if(td && !td[2] && !line.match(/X/)){ curTool=td[1]; continue; }

    // Coordinate
    const cm = line.match(/^(?:T(\d+))?X([+-]?[\d.]+)Y([+-]?[\d.]+)/);
    if(cm){
      if(cm[1]) curTool=cm[1];
      const x=parseCoord(cm[2],fmtXd);
      const y=parseCoord(cm[3],fmtXd);
      const dia=(tools[curTool]?.dia||0.8)*(metric?1:25.4);
      const r=dia/2;
      primitives.push({ kind:'flash', x, y, ap:{type:'C',params:[dia]}, polarity:'D' });
      minX=Math.min(minX,x-r); minY=Math.min(minY,y-r);
      maxX=Math.max(maxX,x+r); maxY=Math.max(maxY,y+r);
    }
  }
  if(minX===Infinity){minX=0;minY=0;maxX=100;maxY=100;}
  return { primitives, bounds:{minX,minY,maxX,maxY} };
}

// ─────────────────────────────────────────────────────────────────────────────
//  Renderer
// ─────────────────────────────────────────────────────────────────────────────
class Renderer {
  constructor(canvas) {
    this.canvas  = canvas;
    this.ctx     = canvas.getContext('2d');
    this.layers  = [];
    this.tx = 0; this.ty = 0; this.scale = 1;
    this.bgColor = '#e8f0ec';
    this.opacity = 1;
    this.bounds  = null;
    this.selectedLayer = null;
  }

  addLayer(l) {
    this.layers.push(l);
    // Render descending by order: high order first (bottom), low order last (on top).
    // This matches the sidebar where low order = top of list = visually on top.
    this.layers.sort((a,b)=>b.meta.order-a.meta.order);
    this._calcBounds();
  }
  clearLayers() { this.layers=[]; this.bounds=null; }

  _calcBounds() {
    let b=null;
    for(const l of this.layers) {
      if(!l.bounds||l.bounds.minX===Infinity) continue;
      if(!b) b={...l.bounds};
      else {
        b.minX=Math.min(b.minX,l.bounds.minX); b.minY=Math.min(b.minY,l.bounds.minY);
        b.maxX=Math.max(b.maxX,l.bounds.maxX); b.maxY=Math.max(b.maxY,l.bounds.maxY);
      }
    }
    this.bounds=b;
  }

  fitView() {
    if(!this.bounds) return;
    const {minX,minY,maxX,maxY}=this.bounds;
    const W=this.canvas.width, H=this.canvas.height;
    const bW=maxX-minX||1, bH=maxY-minY||1;
    const s=Math.min(W/bW, H/bH)*0.88;
    this.scale=s;
    const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
    // Gerber Y grows up, screen Y grows down → flip Y
    this.tx = W/2 - s*cx;
    this.ty = H/2 + s*cy;
  }

  render() {
    const {ctx,canvas}=this;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle=this.bgColor;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!this.layers.length) return;

    // Draw all layers in normal order, skipping the selected one
    for(const layer of this.layers) {
      if(!layer.visible) continue;
      if(layer === this.selectedLayer) continue;  // draw last
      this._renderLayer(layer);
    }
    // Draw selected layer on top
    if(this.selectedLayer && this.selectedLayer.visible) {
      this._renderLayer(this.selectedLayer);
    }
  }

  // Convert Gerber mm coords → canvas pixels.
  // Gerber Y grows upward; canvas Y grows downward → negate Y.
  _px(x) { return this.tx + x * this.scale; }
  _py(y) { return this.ty - y * this.scale; }   // note: minus
  _ps(v) { return Math.abs(v * this.scale); }    // scalar (size/width)

  // Return axis-aligned bounding box of a primitive in Gerber mm {minX,minY,maxX,maxY}
  primitiveBounds(p) {
    if (p.kind==='flash') {
      const ap=p.ap, pr=ap.params;
      let hw=0, hh=0;
      if(ap.type==='C')      { hw=hh=(pr[0]||0.1)/2; }
      else if(ap.type==='R') { hw=(pr[0]||0.1)/2; hh=(pr[1]!==undefined?pr[1]:pr[0]||0.1)/2; }
      else if(ap.type==='O') { hw=(pr[0]||0.1)/2; hh=(pr[1]!==undefined?pr[1]:pr[0]||0.1)/2; }
      else if(ap.type==='S') { hw=hh=(pr[0]||0.1)/2; }
      else if(ap.type==='THERMAL'||ap.type==='P') { hw=hh=(pr[0]||0.5)/2; }
      else { hw=hh=(pr[0]||0.1)/2; }
      return { minX:p.x-hw, minY:p.y-hh, maxX:p.x+hw, maxY:p.y+hh };
    }
    if (p.kind==='line') {
      const r=p.w/2;
      return { minX:Math.min(p.x1,p.x2)-r, minY:Math.min(p.y1,p.y2)-r,
               maxX:Math.max(p.x1,p.x2)+r, maxY:Math.max(p.y1,p.y2)+r };
    }
    if (p.kind==='arc') {
      const r=p.rad+p.w/2;
      return { minX:p.cx-r, minY:p.cy-r, maxX:p.cx+r, maxY:p.cy+r };
    }
    if (p.kind==='region') {
      let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
      for(const pt of p.path){ x0=Math.min(x0,pt.x);y0=Math.min(y0,pt.y);x1=Math.max(x1,pt.x);y1=Math.max(y1,pt.y); }
      return { minX:x0, minY:y0, maxX:x1, maxY:y1 };
    }
    return null;
  }

  _renderLayer(layer) {
    const {ctx}=this;
    const col=layer.meta.color;

    // Draw onto an offscreen canvas so destination-out polarity works correctly
    const off=new OffscreenCanvas(this.canvas.width, this.canvas.height);
    const octx=off.getContext('2d');

    for(const p of layer.primitives) {
      if(p.polarity==='C') {
        octx.save();
        octx.globalCompositeOperation='destination-out';
        this._draw(octx, p, 'rgba(255,255,255,1)');
        octx.restore();
      } else {
        this._draw(octx, p, col);
      }
    }

    ctx.save();
    ctx.globalAlpha=this.opacity;
    ctx.drawImage(off, 0, 0);
    ctx.restore();
  }

  _draw(ctx, p, col) {
    ctx.strokeStyle=col; ctx.fillStyle=col;
    if(p.kind==='line') {
      ctx.beginPath();
      ctx.moveTo(this._px(p.x1), this._py(p.y1));
      ctx.lineTo(this._px(p.x2), this._py(p.y2));
      ctx.lineWidth = this._ps(p.w);
      ctx.lineCap='round';
      ctx.stroke();

    } else if(p.kind==='arc') {
      // Y-axis is flipped (Gerber Y-up → canvas Y-down).
      // Correct canvas angle: negate Y delta → atan2(cy-y, x-cx)
      // Flipping Y reverses winding: anticlockwise_canvas = !gerber_cw
      const cpx = this._px(p.cx), cpy = this._py(p.cy);
      const rad  = this._ps(p.rad);
      const lw   = this._ps(p.w);
      ctx.lineWidth = lw;
      ctx.lineCap   = 'round';
      ctx.beginPath();

      // Full-circle detection: start and end are the same point (or nearly so).
      // ctx.arc with a1==a2 draws nothing; we must use a full 2π sweep instead.
      const dx = p.x2 - p.x1, dy = p.y2 - p.y1;
      if (dx*dx + dy*dy < 1e-10) {
        // Full circle — winding doesn't matter for 2π
        ctx.arc(cpx, cpy, rad, 0, Math.PI * 2);
      } else {
        const a1 = Math.atan2(p.cy - p.y1, p.x1 - p.cx);
        const a2 = Math.atan2(p.cy - p.y2, p.x2 - p.cx);
        ctx.arc(cpx, cpy, rad, a1, a2, !p.cw);
      }
      ctx.stroke();

    } else if(p.kind==='region') {
      if(!p.path.length) return;
      ctx.beginPath();
      ctx.moveTo(this._px(p.path[0].x), this._py(p.path[0].y));
      for(let k=1;k<p.path.length;k++)
        ctx.lineTo(this._px(p.path[k].x), this._py(p.path[k].y));
      ctx.closePath();
      ctx.fill();

    } else if(p.kind==='flash') {
      this._flash(ctx, p, col);
    }
  }

  _flash(ctx, p, col) {
    ctx.fillStyle=col; ctx.strokeStyle=col;
    const px=this._px(p.x), py=this._py(p.y);
    const pr=p.ap.params;

    if(p.ap.type==='THERMAL') {
      // params: [outer_dia, inner_dia, gap_thickness, rotation_deg]
      const ro       = this._ps((pr[0]||1.0)/2);
      const ri       = this._ps((pr[1]||0.5)/2);
      const gapMM    = (pr[2]||0.2);
      const rot      = ((pr[3]||45) * Math.PI/180);
      // gap half-angle from gap width and outer radius
      const gapHalf  = Math.asin(Math.min(0.99, this._ps(gapMM/2) / Math.max(ro, 1e-6)));
      ctx.beginPath();
      for (let q = 0; q < 4; q++) {
        const base = rot + q * Math.PI/2;
        const a1 = base + gapHalf;
        const a2 = base + Math.PI/2 - gapHalf;
        if (a2 <= a1) continue;
        ctx.moveTo(px + ro*Math.cos(a1), py + ro*Math.sin(a1));
        ctx.arc(px, py, ro, a1, a2, false);
        ctx.lineTo(px + ri*Math.cos(a2), py + ri*Math.sin(a2));
        ctx.arc(px, py, ri, a2, a1, true);
        ctx.closePath();
      }
      ctx.fill();

    } else if(p.ap.type==='C') {
      const r  = this._ps((pr[0]||0.1)/2);
      const hr = this._ps((pr[1]||0)/2);
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI*2, false);
      if(hr>0) ctx.arc(px, py, hr, 0, Math.PI*2, true);
      ctx.fill('evenodd');

    } else if(p.ap.type==='R') {
      // pr[0]=width, pr[1]=height (defaults to width), pr[2]=optional hole dia
      const hw = this._ps((pr[0]||0.1)/2);
      const hh = this._ps((pr[1]!==undefined?pr[1]:pr[0]||0.1)/2);
      const hr = this._ps((pr[2]||0)/2);
      ctx.beginPath();
      ctx.rect(px-hw, py-hh, hw*2, hh*2);
      if(hr>0) ctx.arc(px, py, hr, 0, Math.PI*2, true);
      ctx.fill('evenodd');

    } else if(p.ap.type==='O') {
      // Obround / rounded-rectangle from macro bounding box.
      // pr[0]=w, pr[1]=h, pr[2]=offX (Gerber mm), pr[3]=offY (Gerber mm), pr[4]=cornerRadius (Gerber mm)
      const offX = pr[2]||0, offY = pr[3]||0;
      const cx = px + offX * this.scale;
      const cy = py - offY * this.scale;
      const hw = this._ps((pr[0]||0.1)/2);
      const hh = this._ps((pr[1]!==undefined?pr[1]:pr[0]||0.1)/2);
      // Use stored corner radius if available (macro-resolved pad with exact cornerR in params[4]);
      // otherwise this is a plain RS-274X O (obround) aperture whose ends are full semicircles,
      // so r = half the short side exactly.
      const r = pr[4] !== undefined
        ? Math.min(this._ps(pr[4]), Math.min(hw, hh))
        : Math.min(hw, hh);  // true obround: semicircular ends
      // Manual rounded-rect path (works on all Chrome versions, including OffscreenCanvas)
      ctx.beginPath();
      ctx.moveTo(cx - hw + r, cy - hh);
      ctx.lineTo(cx + hw - r, cy - hh);
      ctx.arcTo (cx + hw, cy - hh,  cx + hw, cy - hh + r,  r);
      ctx.lineTo(cx + hw, cy + hh - r);
      ctx.arcTo (cx + hw, cy + hh,  cx + hw - r, cy + hh,  r);
      ctx.lineTo(cx - hw + r, cy + hh);
      ctx.arcTo (cx - hw, cy + hh,  cx - hw, cy + hh - r,  r);
      ctx.lineTo(cx - hw, cy - hh + r);
      ctx.arcTo (cx - hw, cy - hh,  cx - hw + r, cy - hh,  r);
      ctx.closePath();
      ctx.fill();

    } else if(p.ap.type==='P') {
      // Regular polygon: pr[0]=circumscribed dia, pr[1]=vertices, pr[2]=rotation°
      // Rotation is in Gerber space (Y-up). Canvas is Y-down, so negate the angle
      // to keep the polygon orientation correct after the Y-axis mirror.
      const r     = this._ps((pr[0]||0.1)/2);
      const sides = Math.max(3, Math.round(pr[1]||6));
      const rot   = -((pr[2]||0) * Math.PI/180);  // negate for Y-flip
      ctx.beginPath();
      for(let k=0;k<sides;k++){
        const a = rot + k*2*Math.PI/sides;
        const ex=px+r*Math.cos(a), ey=py+r*Math.sin(a);
        k===0 ? ctx.moveTo(ex,ey) : ctx.lineTo(ex,ey);
      }
      ctx.closePath(); ctx.fill();

    } else if(p.ap.type==='S') {
      const hs = this._ps((pr[0]||0.1)/2);
      ctx.beginPath(); ctx.rect(px-hs, py-hs, hs*2, hs*2); ctx.fill();

    } else {
      const r = this._ps((pr[0]||0.1)/2);
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
    }
  }
}

const canvas    = document.getElementById('pcb-canvas');
const mainView  = document.getElementById('main-view');
const layerList = document.getElementById('layer-list');
const emptyEl   = document.getElementById('empty-state');
const renderer  = new Renderer(canvas);
let   layers    = [];

// ── Canvas sizing
function resizeCanvas() {
  const r=mainView.getBoundingClientRect();
  canvas.width =Math.floor(r.width);
  canvas.height=Math.floor(r.height);
  if(typeof measCanvas!=='undefined') {
    measCanvas.width=canvas.width;
    measCanvas.height=canvas.height;
  }
  renderer.render();
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 0);

// ── File loading
async function loadFiles(fileList) {
  let loaded=0;
  for(const file of fileList) {
    const name=file.name;
    const ext=name.split('.').pop().toLowerCase();
    let text;
    try { text=await file.text(); } catch(e){ console.error(e); continue; }

    let result;
    try {
      if(ext==='drl'||ext==='xln') result=parseExcellon(text);
      else                          result=parseGerber(text);
    } catch(e){ console.error('Parse error',name,e); continue; }

    const meta=getLayerMeta(ext);
    const layer={ name, ext, meta, primitives:result.primitives, bounds:result.bounds, visible:true };
    layers.push(layer);
    renderer.addLayer(layer);
    loaded++;
  }

  if(!loaded) { showToast('No files parsed'); return; }
  renderer.fitView();
  renderer.render();
  updateLayerList();
  updateStatus();
  updateZoom();
  emptyEl.style.display='none';
  showToast(`Loaded ${loaded} file${loaded>1?'s':''}`);
}

// ── Layer list with drag-to-reorder
let dragSrc = null;

function updateLayerList() {
  if(!layers.length){
    layerList.innerHTML='<div style="font-size:.68rem;color:var(--muted);padding:.5rem;font-family:\'Share Tech Mono\',monospace;text-align:center">No layers loaded</div>';
    return;
  }
  layerList.innerHTML='';
  // Display in current render order (ascending meta.order)
  const sorted=[...layers].sort((a,b)=>a.meta.order-b.meta.order);
  for(const l of sorted){
    const div=document.createElement('div');
    div.className='layer-item';
    div.draggable=true;
    div.dataset.layerName=l.name;
    div.innerHTML=`
      <div class="drag-handle" title="Drag to reorder">⠿</div>
      <div class="swatch" style="background:${l.meta.color}"></div>
      <div class="lname" title="${l.name}">${l.name}</div>
      ${l.dirty ? '<div class="ldirty" title="Layer has been edited">✎</div>' : ''}
      <div class="lext">${l.ext.toUpperCase()}</div>
      <div class="leye ${l.visible?'':'off'}">${l.visible?'👁':'○'}</div>
    `;
    // Row click → select/deselect layer (brings to front while selected)
    div.addEventListener('click', e => {
      // Ignore clicks on interactive child elements
      if (e.target.closest('.swatch,.leye,.drag-handle')) return;
      if (renderer.selectedLayer === l) {
        renderer.selectedLayer = null;
        div.classList.remove('layer-selected');
      } else {
        // Deselect previous
        document.querySelectorAll('.layer-item.layer-selected')
          .forEach(el => el.classList.remove('layer-selected'));
        renderer.selectedLayer = l;
        div.classList.add('layer-selected');
      }
      renderer.render();
    });

    // Swatch click → colour picker
    const swatchEl = div.querySelector('.swatch');
    swatchEl.title = 'Click to change colour';
    swatchEl.addEventListener('click', e => {
      e.stopPropagation();
      const picker = document.createElement('input');
      picker.type = 'color';
      picker.value = l.meta.color;
      picker.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none';
      document.body.appendChild(picker);
      picker.addEventListener('input', () => {
        l.meta.color = picker.value;
        swatchEl.style.background = picker.value;
        renderer.render();
      });
      picker.addEventListener('change', () => {
        l.meta.color = picker.value;
        swatchEl.style.background = picker.value;
        renderer.render();
        document.body.removeChild(picker);
      });
      picker.click();
    });

    div.querySelector('.leye').addEventListener('click', e=>{
      e.stopPropagation();
      l.visible=!l.visible;
      renderer.render();
      updateLayerList();
      updateStatus();
    });

    // ── Drag events
    div.addEventListener('dragstart', e=>{
      dragSrc=l;
      div.classList.add('dragging-self');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', l.name);
    });
    div.addEventListener('dragend', ()=>{
      div.classList.remove('dragging-self');
      document.querySelectorAll('.layer-item').forEach(el=>{
        el.classList.remove('drag-over-top','drag-over-bot');
      });
    });
    div.addEventListener('dragover', e=>{
      if(!dragSrc||dragSrc===l) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      const rect=div.getBoundingClientRect();
      const mid=rect.top+rect.height/2;
      div.classList.toggle('drag-over-top', e.clientY<mid);
      div.classList.toggle('drag-over-bot', e.clientY>=mid);
    });
    div.addEventListener('dragleave', ()=>{
      div.classList.remove('drag-over-top','drag-over-bot');
    });
    div.addEventListener('drop', e=>{
      e.preventDefault();
      if(!dragSrc||dragSrc===l) return;
      div.classList.remove('drag-over-top','drag-over-bot');

      // Sidebar list is sorted ascending by order (low = top of list)
      const list=[...layers].sort((a,b)=>a.meta.order-b.meta.order);
      const fromIdx=list.indexOf(dragSrc);
      const toIdx  =list.indexOf(l);
      list.splice(fromIdx,1);
      const rect=div.getBoundingClientRect();
      const insertAfter=e.clientY>=rect.top+rect.height/2;
      // Recalculate toIdx after splice
      const newToIdx = list.indexOf(l);
      list.splice(insertAfter ? newToIdx+1 : newToIdx, 0, dragSrc);

      // Reassign order values so position 0 (top of sidebar) = lowest order number
      list.forEach((layer,i)=>{ layer.meta.order=(i+1)*10; });
      // Renderer draws descending by order (high order first = bottom, low order last = top)
      renderer.layers.sort((a,b)=>b.meta.order-a.meta.order);
      renderer.render();
      updateLayerList();
    });

    layerList.appendChild(div);
  }
}

function updateStatus() {
  document.getElementById('s-layers').textContent=layers.filter(l=>l.visible).length+'/'+layers.length;
  const b=renderer.bounds;
  document.getElementById('s-bounds').textContent=b
    ?`${(b.maxX-b.minX).toFixed(2)}×${(b.maxY-b.minY).toFixed(2)} mm`:'—';
}

// ── Zoom
function updateZoom() {
  const s=renderer.scale;
  document.getElementById('zoom-badge').textContent=s.toFixed(2)+'×';
  document.getElementById('s-zoom').textContent=s.toFixed(2)+'×';
}

function doZoom(factor, cx, cy) {
  const r=renderer;
  const wx=(cx-r.tx)/r.scale;
  const wy=(cy-r.ty)/r.scale;
  r.scale=Math.max(0.01,Math.min(5000,r.scale*factor));
  r.tx=cx-wx*r.scale;
  r.ty=cy-wy*r.scale;
  updateZoom();
  renderer.render();
}

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  doZoom(e.deltaY<0?1.12:1/1.12, e.clientX-rect.left, e.clientY-rect.top);
},{passive:false});

// ── Pan + Selection (unified)
let pan={active:false,x0:0,y0:0,tx0:0,ty0:0};
// Selection-mode state (populated when zoom-sel-btn is active)
const selRect = document.getElementById('sel-rect');
const selBtn  = document.getElementById('zoom-sel-btn');
let selMode = false;
let sel = { active:false, x0:0, y0:0, x1:0, y1:0 };
canvas.addEventListener('mousedown', e=>{
  if(e.button!==0) return;
  if(selMode) {
    const r=canvas.getBoundingClientRect();
    sel.active=true;
    sel.x0=sel.x1=e.clientX-r.left;
    sel.y0=sel.y1=e.clientY-r.top;
    selRect.style.cssText=`display:block;left:${sel.x0}px;top:${sel.y0}px;width:0;height:0`;
  } else if(objSelMode || pasteMode) {
    // handled by capture/paste handlers — do not start pan
  } else {
    pan.active=true; pan.x0=e.clientX; pan.y0=e.clientY;
    pan.tx0=renderer.tx; pan.ty0=renderer.ty;
  }
});
window.addEventListener('mousemove', e=>{
  if(selMode && sel.active) {
    const r=canvas.getBoundingClientRect();
    sel.x1=e.clientX-r.left; sel.y1=e.clientY-r.top;
    const x=Math.min(sel.x0,sel.x1), y=Math.min(sel.y0,sel.y1);
    const w=Math.abs(sel.x1-sel.x0), h=Math.abs(sel.y1-sel.y0);
    selRect.style.left=x+'px'; selRect.style.top=y+'px';
    selRect.style.width=w+'px'; selRect.style.height=h+'px';
  }
  if(pan.active && !objSelMode && !pasteMode){
    renderer.tx=pan.tx0+(e.clientX-pan.x0);
    renderer.ty=pan.ty0+(e.clientY-pan.y0);
    renderer.render();
  }
  // cursor coords
  const rect=canvas.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  const wx=(cx-renderer.tx)/renderer.scale;
  const wy=-(cy-renderer.ty)/renderer.scale;
  document.getElementById('s-xy').textContent=`${wx.toFixed(3)}, ${wy.toFixed(3)} mm`;
});
window.addEventListener('mouseup', e=>{
  if(selMode && sel.active) {
    sel.active=false;
    selRect.style.display='none';
    const px0=Math.min(sel.x0,sel.x1), px1=Math.max(sel.x0,sel.x1);
    const py0=Math.min(sel.y0,sel.y1), py1=Math.max(sel.y0,sel.y1);
    if(px1-px0>8 && py1-py0>8) {
      const t=renderer;
      const gx0=(px0-t.tx)/t.scale, gy1=(t.ty-py0)/t.scale;
      const gx1=(px1-t.tx)/t.scale, gy0=(t.ty-py1)/t.scale;
      const W=canvas.width, H=canvas.height;
      const s=Math.min(W/(gx1-gx0), H/(gy1-gy0))*0.88;
      t.scale=s; t.tx=W/2-s*(gx0+gx1)/2; t.ty=H/2+s*(gy0+gy1)/2;
      updateZoom(); renderer.render();
    }
    exitSelMode();
  }
  pan.active=false;
});

// ── Touch
let tprev={};
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>tprev[t.identifier]={x:t.clientX,y:t.clientY});
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    const prev=tprev[t.identifier];
    if(prev){ renderer.tx+=t.clientX-prev.x; renderer.ty+=t.clientY-prev.y; renderer.render(); }
    tprev[t.identifier]={x:t.clientX,y:t.clientY};
  } else if(e.touches.length===2){
    const [a,b]=Array.from(e.touches);
    const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const rect=canvas.getBoundingClientRect();
    const cx=(a.clientX+b.clientX)/2-rect.left, cy=(a.clientY+b.clientY)/2-rect.top;
    if(tprev._pd) doZoom(dist/tprev._pd,cx,cy);
    tprev._pd=dist;
    tprev[a.identifier]={x:a.clientX,y:a.clientY};
    tprev[b.identifier]={x:b.clientX,y:b.clientY};
  }
},{passive:false});
canvas.addEventListener('touchend', e=>{
  Array.from(e.changedTouches).forEach(t=>delete tprev[t.identifier]);
  if(e.touches.length<2) delete tprev._pd;
});

//  MEASUREMENT TOOL
// ══════════════════════════════════════════════════════════════════════════════
const measCanvas = document.getElementById('meas-canvas');
const measCtx    = measCanvas.getContext('2d');
const measBtn    = document.getElementById('measure-btn');

let measMode    = false;
let measPt1     = null;   // {x,y,snapType} in Gerber mm
let measPending = false;  // waiting for second click
let measCursor  = null;   // {x,y,snapType} live cursor position
let measurements = [];    // [{p1,p2}] finalised measurements

// Paste mode state — declared here (before renderMeasOverlay) so the guard can read them
let pasteMode   = false;
let pasteCursor = null;
let pasteGhosts = [];
let clipboard   = [];

// ── Snap engine ───────────────────────────────────────────────────────────────
// Gather snap candidates from all visible layer primitives.
// Returns array of {x, y, type} in Gerber mm coords.
function buildSnapCandidates() {
  const pts = [];
  for (const layer of renderer.layers) {
    if (!layer.visible) continue;
    for (const p of layer.primitives) {
      if (p.polarity !== 'D') continue;

      if (p.kind === 'flash') {
        // Pad / hole centre
        pts.push({ x: p.x, y: p.y, type: 'centre' });
        // Pad edges (for rect/obround pads)
        const ap = p.ap;
        if (ap.type === 'R' || ap.type === 'O') {
          const hw = (ap.params[0]||0)/2, hh = (ap.params[1]!==undefined?ap.params[1]:ap.params[0]||0)/2;
          pts.push({x:p.x-hw, y:p.y, type:'edge'}, {x:p.x+hw, y:p.y, type:'edge'},
                   {x:p.x, y:p.y-hh, type:'edge'}, {x:p.x, y:p.y+hh, type:'edge'});
        }
      } else if (p.kind === 'line') {
        pts.push({ x:p.x1, y:p.y1, type:'endpoint' },
                 { x:p.x2, y:p.y2, type:'endpoint' },
                 { x:(p.x1+p.x2)/2, y:(p.y1+p.y2)/2, type:'midpoint' });
      } else if (p.kind === 'arc') {
        pts.push({ x:p.cx, y:p.cy, type:'centre' },
                 { x:p.x1, y:p.y1, type:'endpoint' },
                 { x:p.x2, y:p.y2, type:'endpoint' });
      } else if (p.kind === 'region') {
        for (let k = 0; k < p.path.length; k++) {
          pts.push({ x:p.path[k].x, y:p.path[k].y, type:'vertex' });
        }
      }
    }
  }
  return pts;
}

let snapCandidates = [];  // rebuilt when layers change or measure mode entered

// Find nearest snap point within pixelRadius pixels of canvas point (cpx,cpy)
function findSnap(cpx, cpy, pixelRadius) {
  const t = renderer;
  let best = null, bestDist = Infinity;
  for (const c of snapCandidates) {
    const px = t._px(c.x), py = t._py(c.y);
    const d = Math.hypot(px - cpx, py - cpy);
    if (d < pixelRadius && d < bestDist) {
      bestDist = d; best = c;
    }
  }
  return best;
}

// Canvas px → Gerber mm
function canvasToGerber(cpx, cpy) {
  const t = renderer;
  return { x: (cpx - t.tx) / t.scale, y: (t.ty - cpy) / t.scale };
}

// ── Overlay drawing ────────────────────────────────────────────────────────────
const SNAP_RADIUS_PX = 14;
const COL_MEAS   = '#ff4444';
const COL_SNAP   = '#00d4aa';
const COL_FREE   = '#ff9900';
const COL_GHOST  = 'rgba(255,68,68,0.45)';

function drawSnap(ctx, gx, gy, type, color) {
  const px = renderer._px(gx), py = renderer._py(gy);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.5;
  ctx.shadowColor = color;
  ctx.shadowBlur  = 6;
  if (type === 'centre' || type === 'arc-centre') {
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px-9,py); ctx.lineTo(px+9,py);
    ctx.moveTo(px,py-9); ctx.lineTo(px,py+9);
    ctx.stroke();
  } else if (type === 'endpoint' || type === 'vertex') {
    ctx.beginPath();
    ctx.rect(px-5, py-5, 10, 10);
    ctx.stroke();
  } else if (type === 'midpoint') {
    ctx.beginPath();
    ctx.moveTo(px-7,py+7); ctx.lineTo(px,py-7); ctx.lineTo(px+7,py+7);
    ctx.closePath(); ctx.stroke();
  } else if (type === 'edge') {
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI*2);
    ctx.stroke();
  } else {
    // free point
    ctx.beginPath();
    ctx.moveTo(px-6,py-6); ctx.lineTo(px+6,py+6);
    ctx.moveTo(px+6,py-6); ctx.lineTo(px-6,py+6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMeasurement(ctx, p1, p2, ghost) {
  const px1=renderer._px(p1.x), py1=renderer._py(p1.y);
  const px2=renderer._px(p2.x), py2=renderer._py(p2.y);
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dist = Math.hypot(dx, dy);
  const distX = Math.abs(dx), distY = Math.abs(dy);

  ctx.save();
  const lineCol = ghost ? COL_GHOST : COL_MEAS;
  ctx.strokeStyle = lineCol;
  ctx.fillStyle   = lineCol;
  ctx.lineWidth   = ghost ? 1 : 1.5;
  ctx.setLineDash(ghost ? [4,4] : []);

  // Main measurement line
  ctx.beginPath();
  ctx.moveTo(px1, py1);
  ctx.lineTo(px2, py2);
  ctx.stroke();

  // Arrowheads
  if (!ghost) {
    const angle = Math.atan2(py2-py1, px2-px1);
    const aw = 8, ah = 4;
    for (const [bx,by,a] of [[px1,py1,angle+Math.PI],[px2,py2,angle]]) {
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + aw*Math.cos(a-ah/aw*2), by + aw*Math.sin(a-ah/aw*2));
      ctx.lineTo(bx + aw*Math.cos(a+ah/aw*2), by + aw*Math.sin(a+ah/aw*2));
      ctx.closePath(); ctx.fill();
    }

    // Extension lines from snap points
    ctx.setLineDash([3,4]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,68,68,0.4)';
    // Horizontal extension
    if (distX > 0.01) {
      const ey = Math.min(py1,py2) - 14;
      ctx.beginPath();
      ctx.moveTo(px1, py1); ctx.lineTo(px1, ey-4);
      ctx.moveTo(px2, py2); ctx.lineTo(px2, ey-4);
      ctx.stroke();
      // X dimension line
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,68,68,0.7)';
      ctx.beginPath();
      ctx.moveTo(px1, ey); ctx.lineTo(px2, ey);
      ctx.stroke();
      // X label
      drawLabel(ctx, (px1+px2)/2, ey-2, `ΔX ${distX.toFixed(3)} mm`, 'rgba(255,68,68,0.9)');
    }
    // Vertical extension
    if (distY > 0.01) {
      const ex = Math.max(px1,px2) + 14;
      ctx.setLineDash([3,4]);
      ctx.strokeStyle = 'rgba(255,68,68,0.4)';
      ctx.beginPath();
      ctx.moveTo(px1, py1); ctx.lineTo(ex+4, py1);
      ctx.moveTo(px2, py2); ctx.lineTo(ex+4, py2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,68,68,0.7)';
      ctx.beginPath();
      ctx.moveTo(ex, py1); ctx.lineTo(ex, py2);
      ctx.stroke();
      // Y label (rotated)
      ctx.save();
      ctx.translate(ex+14, (py1+py2)/2);
      ctx.rotate(Math.PI/2);
      drawLabel(ctx, 0, 0, `ΔY ${distY.toFixed(3)} mm`, 'rgba(255,68,68,0.9)');
      ctx.restore();
    }
  }

  ctx.setLineDash([]);
  ctx.restore();

  // Main distance label
  if (!ghost) {
    const mx=(px1+px2)/2, my=(py1+py2)/2;
    const angle2 = Math.atan2(py2-py1, px2-px1);
    ctx.save();
    ctx.translate(mx, my);
    // keep label readable (flip if upside down)
    const rot = (angle2 > Math.PI/2 || angle2 < -Math.PI/2) ? angle2+Math.PI : angle2;
    ctx.rotate(rot);
    drawLabel(ctx, 0, -10, `${dist.toFixed(3)} mm`, COL_MEAS);
    ctx.restore();
  }
}

function drawLabel(ctx, x, y, text, color) {
  ctx.save();
  ctx.font = 'bold 11px "Share Tech Mono", monospace';
  const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(10,15,20,0.82)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x-w/2-4, y-10, w+8, 14, 3)
                : ctx.rect(x-w/2-4, y-10, w+8, 14);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y-3);
  ctx.restore();
}

function renderMeasOverlay() {
  measCanvas.width  = canvas.width;
  measCanvas.height = canvas.height;
  measCtx.clearRect(0, 0, measCanvas.width, measCanvas.height);

  // Bail only if there is genuinely nothing to draw
  const hasSelection = typeof selectedPrims !== 'undefined' && selectedPrims.length > 0;
  if (!measMode && !pasteMode && !hasSelection && measurements.length === 0) return;

  // Draw all finalised measurements
  for (const m of measurements) {
    drawMeasurement(measCtx, m.p1, m.p2, false);
    drawSnap(measCtx, m.p1.x, m.p1.y, m.p1.snapType||'free', COL_MEAS);
    drawSnap(measCtx, m.p2.x, m.p2.y, m.p2.snapType||'free', COL_MEAS);
  }

  // Object selection highlights (drawn regardless of measMode)
  if (typeof drawObjSelHighlights === 'function') drawObjSelHighlights();

  // Paste ghost preview
  if (pasteMode && pasteCursor) {
    const origin = clipboardCentroid();
    const dx = pasteCursor.x - origin.x, dy = pasteCursor.y - origin.y;

    for (const { prim } of clipboard) {
      const ghost = offsetPrim(prim, dx, dy);
      _drawPasteGhost(measCtx, ghost);
    }

    // Crosshair at cursor — drawn with white halo for visibility on any background
    const cpx3 = renderer._px(pasteCursor.x), cpy3 = renderer._py(pasteCursor.y);
    measCtx.save();
    measCtx.setLineDash([]);
    measCtx.lineCap = 'round';
    // White halo
    measCtx.strokeStyle = 'rgba(255,255,255,0.85)';
    measCtx.lineWidth = 3;
    measCtx.beginPath();
    measCtx.moveTo(cpx3-18, cpy3); measCtx.lineTo(cpx3+18, cpy3);
    measCtx.moveTo(cpx3, cpy3-18); measCtx.lineTo(cpx3, cpy3+18);
    measCtx.stroke();
    // Orange line
    measCtx.strokeStyle = '#ff9900';
    measCtx.lineWidth = 1.5;
    measCtx.beginPath();
    measCtx.moveTo(cpx3-18, cpy3); measCtx.lineTo(cpx3+18, cpy3);
    measCtx.moveTo(cpx3, cpy3-18); measCtx.lineTo(cpx3, cpy3+18);
    measCtx.stroke();
    // Centre circle
    measCtx.beginPath();
    measCtx.arc(cpx3, cpy3, 4, 0, Math.PI*2);
    measCtx.stroke();
    measCtx.restore();

    // Hint badge
    measCtx.save();
    measCtx.font = 'bold 11px "Share Tech Mono",monospace';
    const ht = 'Click or Enter to place  •  Esc to cancel';
    const hw2 = measCtx.measureText(ht).width;
    measCtx.fillStyle = 'rgba(255,153,0,0.92)';
    measCtx.beginPath();
    if (measCtx.roundRect) measCtx.roundRect(6, 6, hw2+12, 20, 3);
    else measCtx.rect(6, 6, hw2+12, 20);
    measCtx.fill();
    measCtx.fillStyle = '#000';
    measCtx.textBaseline = 'middle';
    measCtx.fillText(ht, 12, 16);
    measCtx.restore();
  }

  if (!measMode) return;

  // Draw live cursor snap indicator
  if (measCursor) {
    const col = measCursor.snapType ? COL_SNAP : COL_FREE;
    drawSnap(measCtx, measCursor.x, measCursor.y, measCursor.snapType||'free', col);
  }

  // Draw ghost line from p1 to cursor
  if (measPt1 && measCursor) {
    drawMeasurement(measCtx, measPt1, measCursor, true);
    drawSnap(measCtx, measPt1.x, measPt1.y, measPt1.snapType||'free', COL_MEAS);
  }
}

// ── Mode toggle ───────────────────────────────────────────────────────────────
function enterMeasMode() {
  measMode = true;
  measBtn.classList.add('active');
  canvas.style.cursor = 'crosshair';
  snapCandidates = buildSnapCandidates();
  measPt1 = null;
  renderMeasOverlay();
}
function exitMeasMode() {
  measMode = false;
  measBtn.classList.remove('active');
  canvas.style.cursor = 'grab';
  measPt1 = null; measCursor = null;
  renderMeasOverlay();
}

measBtn.addEventListener('click', () => {
