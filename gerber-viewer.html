  else {
    exitSelMode();
    enterMeasMode();
  }
});

// Clear all measurements with double-click on measure button or Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (measMode) {
      if (measPt1) { measPt1 = null; renderMeasOverlay(); }
      else exitMeasMode();
    }
    if (selMode) exitSelMode();
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (measMode && measurements.length > 0) {
      measurements.pop();
      renderMeasOverlay();
    }
  }
});

// Double-click measure button clears all
measBtn.addEventListener('dblclick', e => {
  e.stopPropagation();
  measurements = [];
  renderMeasOverlay();
  showToast('Measurements cleared');
});

// ── Mouse events for measurement + paste ─────────────────────────────────────
// Paste ghost tracks on window so it works even before first canvas mousemove
window.addEventListener('mousemove', e => {
  if (!pasteMode) return;
  const rect = canvas.getBoundingClientRect();
  const cpx = e.clientX - rect.left, cpy = e.clientY - rect.top;
  pasteCursor = canvasToGerber(cpx, cpy);
  renderMeasOverlay();
});

canvas.addEventListener('mousemove', e => {
  if (!measMode) return;
  const rect = canvas.getBoundingClientRect();
  const cpx = e.clientX - rect.left, cpy = e.clientY - rect.top;
  const snap = findSnap(cpx, cpy, SNAP_RADIUS_PX);
  if (snap) {
    measCursor = { x: snap.x, y: snap.y, snapType: snap.type };
  } else {
    const g = canvasToGerber(cpx, cpy);
    measCursor = { x: g.x, y: g.y, snapType: null };
  }
  renderMeasOverlay();
});

canvas.addEventListener('click', e => {
  const rect2 = canvas.getBoundingClientRect();
  const cpx = e.clientX - rect2.left, cpy = e.clientY - rect2.top;

  // Paste placement on click
  if (pasteMode && pasteCursor) {
    commitPaste(pasteCursor.x, pasteCursor.y);
    return;
  }

  if (!measMode) return;
  const snap = findSnap(cpx, cpy, SNAP_RADIUS_PX);
  const pt = snap
    ? { x: snap.x, y: snap.y, snapType: snap.type }
    : { ...canvasToGerber(cpx, cpy), snapType: null };

  if (!measPt1) {
    measPt1 = pt;
    showToast('Click second point to complete measurement');
  } else {
    measurements.push({ p1: measPt1, p2: pt });
    measPt1 = null;
    renderMeasOverlay();
    const dist = Math.hypot(pt.x - measurements[measurements.length-1].p1.x,
                            pt.y - measurements[measurements.length-1].p1.y);
    showToast(`${dist.toFixed(3)} mm`);
  }
});

// Re-render overlay when board renders (zoom/pan)
const origRender = renderer.render.bind(renderer);
renderer.render = function() { origRender(); renderMeasOverlay(); };

// Rebuild snap candidates when layers change
const origUpdateLayerList = updateLayerList;
// (snap candidates rebuilt on mode entry so always fresh)

// ══════════════════════════════════════════════════════════════════════════════
//  OBJECT SELECTION / COPY / CUT / PASTE
// ══════════════════════════════════════════════════════════════════════════════
const objSelBtn  = document.getElementById('obj-sel-btn');
const copyBtn    = document.getElementById('copy-btn');
const cutBtn     = document.getElementById('cut-btn');
const pasteBtn   = document.getElementById('paste-btn');

let objSelMode   = false;
let objSel       = { active:false, x0:0,y0:0,x1:0,y1:0 };  // rubber-band in pixels
// selectedPrimitives: [{prim, layer}]
let selectedPrims = [];
// paste offset accumulates so repeated pastes stagger
let pasteOffset = 0;

// ── Rubber-band selection rect (reuse sel-rect element) ───────────────────────
// sel-rect is already in the DOM; zoom-to-selection also uses it.
// We gate by mode so they don't clash.

// ── Enter / exit object select mode ──────────────────────────────────────────
function enterObjSelMode() {
  objSelMode = true;
  objSelBtn.classList.add('active');
  canvas.style.cursor = 'crosshair';
  // Exit other modes
  if (selMode)  exitSelMode();
  if (measMode) exitMeasMode();
}
function exitObjSelMode() {
  objSelMode = false;
  objSelBtn.classList.remove('active');
  canvas.style.cursor = 'grab';
  objSel.active = false;
  selRect.style.display = 'none';
}
function clearObjSelection() {
  selectedPrims = [];
  stopMarchingAnts();
  renderMeasOverlay();
}

objSelBtn.addEventListener('click', () => {
  if (objSelMode) { exitObjSelMode(); clearObjSelection(); }
  else enterObjSelMode();
});

// ── Hit test: find all primitives whose AABB intersects the rubber-band ───────
function selectInRect(gx0, gy0, gx1, gy1) {
  // Normalise
  const rx0=Math.min(gx0,gx1), rx1=Math.max(gx0,gx1);
  const ry0=Math.min(gy0,gy1), ry1=Math.max(gy0,gy1);
  const found = [];
  // Only search the active (selected) layer; fall back to all visible if none selected
  const searchLayers = renderer.selectedLayer
    ? [renderer.selectedLayer]
    : renderer.layers.filter(l=>l.visible);
  for (const layer of searchLayers) {
    if (!layer.visible) continue;
    for (const prim of layer.primitives) {
      if (prim.polarity !== 'D') continue;
      const bb = renderer.primitiveBounds(prim);
      if (!bb) continue;
      if (bb.maxX < rx0 || bb.minX > rx1 || bb.maxY < ry0 || bb.minY > ry1) continue;
      found.push({ prim, layer });
    }
  }
  return found;
}

// ── Draw selection highlights on the meas overlay canvas ─────────────────────
function drawObjSelHighlights() {
  if (!selectedPrims.length) return;

  const SEL_FILL   = 'rgba(30,160,255,0.55)';
  const SEL_STROKE = 'rgba(30,160,255,0.90)';
  const SEL_GLOW   = 'rgba(30,160,255,0.30)';

  measCtx.save();

  for (const { prim } of selectedPrims) {
    // Draw a bright filled version of the primitive's actual shape
    measCtx.save();
    measCtx.fillStyle   = SEL_FILL;
    measCtx.strokeStyle = SEL_STROKE;
    measCtx.shadowColor = SEL_GLOW;
    measCtx.shadowBlur  = 10;
    measCtx.setLineDash([]);

    if (prim.kind === 'flash') {
      _drawSelFlash(measCtx, prim);
    } else if (prim.kind === 'line') {
      measCtx.beginPath();
      measCtx.moveTo(renderer._px(prim.x1), renderer._py(prim.y1));
      measCtx.lineTo(renderer._px(prim.x2), renderer._py(prim.y2));
      measCtx.lineWidth = Math.max(renderer._ps(prim.w), 2);
      measCtx.lineCap   = 'round';
      measCtx.stroke();
    } else if (prim.kind === 'arc') {
      const cpx = renderer._px(prim.cx), cpy = renderer._py(prim.cy);
      const rad  = renderer._ps(prim.rad);
      const dxe  = prim.x2 - prim.x1, dye = prim.y2 - prim.y1;
      measCtx.beginPath();
      if (dxe*dxe + dye*dye < 1e-10) {
        measCtx.arc(cpx, cpy, rad, 0, Math.PI*2);
      } else {
        const a1 = Math.atan2(prim.cy - prim.y1, prim.x1 - prim.cx);
        const a2 = Math.atan2(prim.cy - prim.y2, prim.x2 - prim.cx);
        measCtx.arc(cpx, cpy, rad, a1, a2, !prim.cw);
      }
      measCtx.lineWidth = Math.max(renderer._ps(prim.w), 2);
      measCtx.lineCap   = 'round';
      measCtx.stroke();
    } else if (prim.kind === 'region') {
      if (!prim.path.length) { measCtx.restore(); continue; }
      measCtx.beginPath();
      measCtx.moveTo(renderer._px(prim.path[0].x), renderer._py(prim.path[0].y));
      for (let k = 1; k < prim.path.length; k++)
        measCtx.lineTo(renderer._px(prim.path[k].x), renderer._py(prim.path[k].y));
      measCtx.closePath();
      measCtx.fill();
      measCtx.lineWidth = 1;
      measCtx.stroke();
    }

    measCtx.restore();
  }

  // Marching-ants outline around the combined bounding box of all selected prims
  let bbAll = null;
  for (const { prim } of selectedPrims) {
    const bb = renderer.primitiveBounds(prim);
    if (!bb) continue;
    if (!bbAll) bbAll = { ...bb };
    else {
      bbAll.minX = Math.min(bbAll.minX, bb.minX);
      bbAll.minY = Math.min(bbAll.minY, bb.minY);
      bbAll.maxX = Math.max(bbAll.maxX, bb.maxX);
      bbAll.maxY = Math.max(bbAll.maxY, bb.maxY);
    }
  }
  if (bbAll) {
    const px0 = renderer._px(bbAll.minX) - 5, py0 = renderer._py(bbAll.maxY) - 5;
    const pw  = renderer._px(bbAll.maxX) - px0 + 5;
    const ph  = renderer._py(bbAll.minY) - py0 + 5;
    // Animate marching ants via dashOffset stored on measCanvas
    measCanvas._dashOff = ((measCanvas._dashOff || 0) + 0.5) % 12;
    measCtx.save();
    measCtx.strokeStyle = '#1ea0ff';
    measCtx.lineWidth   = 1.5;
    measCtx.setLineDash([6, 4]);
    measCtx.lineDashOffset = -measCanvas._dashOff;
    measCtx.strokeRect(px0, py0, pw, ph);
    // White underlayer for contrast
    measCtx.strokeStyle = 'rgba(255,255,255,0.6)';
    measCtx.setLineDash([6, 4]);
    measCtx.lineDashOffset = -measCanvas._dashOff + 6;
    measCtx.strokeRect(px0, py0, pw, ph);
    measCtx.restore();
  }

  // Badge
  const txt = `${selectedPrims.length} object${selectedPrims.length>1?'s':''} selected`;
  measCtx.font = 'bold 11px "Share Tech Mono",monospace';
  const tw = measCtx.measureText(txt).width;
  measCtx.fillStyle = 'rgba(30,160,255,0.93)';
  measCtx.beginPath();
  if (measCtx.roundRect) measCtx.roundRect(6, 6, tw+12, 20, 3);
  else measCtx.rect(6, 6, tw+12, 20);
  measCtx.fill();
  measCtx.fillStyle = '#fff';
  measCtx.textBaseline = 'middle';
  measCtx.fillText(txt, 12, 16);

  // Kick off animation if not already running
  startMarchingAnts();
  measCtx.restore();
}

function _drawPasteGhost(ctx, p) {
  const FILL   = 'rgba(255,153,0,0.55)';
  const STROKE = 'rgba(255,200,0,0.95)';
  ctx.save();
  ctx.setLineDash([]);
  ctx.fillStyle   = FILL;
  ctx.strokeStyle = STROKE;
  ctx.shadowColor = 'rgba(255,153,0,0.5)';
  ctx.shadowBlur  = 10;

  if (p.kind === 'flash') {
    const px = renderer._px(p.x), py = renderer._py(p.y);
    const pr = p.ap.params;
    if (p.ap.type === 'C') {
      const r  = Math.max(renderer._ps((pr[0]||0.1)/2), 1.5);
      const hr = renderer._ps((pr[1]||0)/2);
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI*2, false);
      if (hr > 0) ctx.arc(px, py, hr, 0, Math.PI*2, true);
      ctx.fill('evenodd'); ctx.lineWidth=1; ctx.stroke();
    } else if (p.ap.type === 'R' || p.ap.type === 'S') {
      const hw = renderer._ps((pr[0]||0.1)/2);
      const hh = renderer._ps((pr[1]!==undefined?pr[1]:pr[0]||0.1)/2);
      ctx.beginPath(); ctx.rect(px-hw, py-hh, hw*2, hh*2);
      ctx.fill(); ctx.lineWidth=1; ctx.stroke();
    } else if (p.ap.type === 'O') {
      const hw  = renderer._ps((pr[0]||0.1)/2);
      const hh  = renderer._ps((pr[1]!==undefined?pr[1]:pr[0]||0.1)/2);
      const offX = (pr[2]||0)*renderer.scale, offY = (pr[3]||0)*renderer.scale;
      const cx2 = px+offX, cy2 = py-offY;
      const r   = pr[4]!==undefined ? Math.min(renderer._ps(pr[4]),Math.min(hw,hh)) : Math.min(hw,hh);
      ctx.beginPath();
      ctx.moveTo(cx2-hw+r,cy2-hh); ctx.lineTo(cx2+hw-r,cy2-hh);
      ctx.arcTo(cx2+hw,cy2-hh,cx2+hw,cy2-hh+r,r);
      ctx.lineTo(cx2+hw,cy2+hh-r);
      ctx.arcTo(cx2+hw,cy2+hh,cx2+hw-r,cy2+hh,r);
      ctx.lineTo(cx2-hw+r,cy2+hh);
      ctx.arcTo(cx2-hw,cy2+hh,cx2-hw,cy2+hh-r,r);
      ctx.lineTo(cx2-hw,cy2-hh+r);
      ctx.arcTo(cx2-hw,cy2-hh,cx2-hw+r,cy2-hh,r);
      ctx.closePath(); ctx.fill(); ctx.lineWidth=1; ctx.stroke();
    } else if (p.ap.type === 'THERMAL') {
      const ro = renderer._ps((pr[0]||1)/2), ri = renderer._ps((pr[1]||0.5)/2);
      const gapHalf = Math.asin(Math.min(0.99, renderer._ps((pr[2]||0.2)/2)/Math.max(ro,1e-6)));
      const rot = (pr[3]||45)*Math.PI/180;
      ctx.beginPath();
      for (let q=0;q<4;q++) {
        const base=rot+q*Math.PI/2, a1=base+gapHalf, a2=base+Math.PI/2-gapHalf;
        if(a2<=a1) continue;
        ctx.moveTo(px+ro*Math.cos(a1),py+ro*Math.sin(a1));
        ctx.arc(px,py,ro,a1,a2,false);
        ctx.lineTo(px+ri*Math.cos(a2),py+ri*Math.sin(a2));
        ctx.arc(px,py,ri,a2,a1,true); ctx.closePath();
      }
      ctx.fill(); ctx.lineWidth=1; ctx.stroke();
    } else {
      const r = Math.max(renderer._ps((pr[0]||0.1)/2), 1.5);
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
      ctx.fill(); ctx.lineWidth=1; ctx.stroke();
    }
  } else if (p.kind === 'line') {
    ctx.beginPath();
    ctx.moveTo(renderer._px(p.x1), renderer._py(p.y1));
    ctx.lineTo(renderer._px(p.x2), renderer._py(p.y2));
    ctx.lineWidth = Math.max(renderer._ps(p.w), 1.5);
    ctx.lineCap = 'round'; ctx.stroke();
  } else if (p.kind === 'arc') {
    const cpx2=renderer._px(p.cx), cpy2=renderer._py(p.cy);
    const rad2=renderer._ps(p.rad);
    const dxe=p.x2-p.x1, dye=p.y2-p.y1;
    ctx.beginPath();
    if (dxe*dxe+dye*dye < 1e-10) {
      ctx.arc(cpx2,cpy2,rad2,0,Math.PI*2);
    } else {
      const a1=Math.atan2(p.cy-p.y1,p.x1-p.cx), a2=Math.atan2(p.cy-p.y2,p.x2-p.cx);
      ctx.arc(cpx2,cpy2,rad2,a1,a2,!p.cw);
    }
    ctx.lineWidth=Math.max(renderer._ps(p.w),1.5); ctx.lineCap='round'; ctx.stroke();
  } else if (p.kind === 'region') {
    if (!p.path.length) { ctx.restore(); return; }
    ctx.beginPath();
    ctx.moveTo(renderer._px(p.path[0].x), renderer._py(p.path[0].y));
    for (let k=1;k<p.path.length;k++)
      ctx.lineTo(renderer._px(p.path[k].x), renderer._py(p.path[k].y));
    ctx.closePath(); ctx.fill(); ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();
}

function _drawSelFlash(ctx, p) {
  const px = renderer._px(p.x), py = renderer._py(p.y);
  const pr = p.ap.params;
  ctx.fillStyle   = 'rgba(30,160,255,0.55)';
  ctx.strokeStyle = 'rgba(30,160,255,0.90)';
  ctx.lineWidth   = 1;

  if (p.ap.type === 'C') {
    const r = renderer._ps((pr[0]||0.1)/2);
    const hr = renderer._ps((pr[1]||0)/2);
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI*2, false);
    if (hr > 0) ctx.arc(px, py, hr, 0, Math.PI*2, true);
    ctx.fill('evenodd');
    ctx.stroke();
  } else if (p.ap.type === 'R' || p.ap.type === 'S') {
    const hw = renderer._ps((pr[0]||0.1)/2);
    const hh = renderer._ps((pr[1]!==undefined?pr[1]:pr[0]||0.1)/2);
    ctx.beginPath(); ctx.rect(px-hw, py-hh, hw*2, hh*2); ctx.fill(); ctx.stroke();
  } else if (p.ap.type === 'O') {
    const hw = renderer._ps((pr[0]||0.1)/2);
    const hh = renderer._ps((pr[1]!==undefined?pr[1]:pr[0]||0.1)/2);
    const offX = (pr[2]||0)*renderer.scale, offY = (pr[3]||0)*renderer.scale;
    const cx = px+offX, cy = py-offY;
    const r = pr[4] !== undefined ? Math.min(renderer._ps(pr[4]), Math.min(hw,hh)) : Math.min(hw,hh);
    ctx.beginPath();
    ctx.moveTo(cx-hw+r, cy-hh); ctx.lineTo(cx+hw-r, cy-hh);
    ctx.arcTo(cx+hw,cy-hh, cx+hw,cy-hh+r, r);
    ctx.lineTo(cx+hw, cy+hh-r);
    ctx.arcTo(cx+hw,cy+hh, cx+hw-r,cy+hh, r);
    ctx.lineTo(cx-hw+r, cy+hh);
    ctx.arcTo(cx-hw,cy+hh, cx-hw,cy+hh-r, r);
    ctx.lineTo(cx-hw, cy-hh+r);
    ctx.arcTo(cx-hw,cy-hh, cx-hw+r,cy-hh, r);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (p.ap.type === 'THERMAL') {
    const ro = renderer._ps((pr[0]||1)/2), ri = renderer._ps((pr[1]||0.5)/2);
    const gapHalf = Math.asin(Math.min(0.99, renderer._ps((pr[2]||0.2)/2)/Math.max(ro,1e-6)));
    const rot = ((pr[3]||45)*Math.PI/180);
    ctx.beginPath();
    for (let q=0;q<4;q++) {
      const base=rot+q*Math.PI/2, a1=base+gapHalf, a2=base+Math.PI/2-gapHalf;
      if(a2<=a1) continue;
      ctx.moveTo(px+ro*Math.cos(a1),py+ro*Math.sin(a1));
      ctx.arc(px,py,ro,a1,a2,false);
      ctx.lineTo(px+ri*Math.cos(a2),py+ri*Math.sin(a2));
      ctx.arc(px,py,ri,a2,a1,true);
      ctx.closePath();
    }
    ctx.fill(); ctx.stroke();
  } else {
    // P or unknown — circle fallback
    const r = renderer._ps((pr[0]||0.1)/2);
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }
}

// ── Marching-ants animation loop ──────────────────────────────────────────────
let _marchingRAF = null;
function startMarchingAnts() {
  if (_marchingRAF) return;
  function tick() {
    if (!selectedPrims.length) { _marchingRAF = null; return; }
    renderMeasOverlay();
    _marchingRAF = requestAnimationFrame(tick);
  }
  _marchingRAF = requestAnimationFrame(tick);
}
function stopMarchingAnts() {
  if (_marchingRAF) { cancelAnimationFrame(_marchingRAF); _marchingRAF = null; }
}
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0 || !objSelMode) return;
  const r = canvas.getBoundingClientRect();
  objSel.active = true;
  objSel.x0 = objSel.x1 = e.clientX - r.left;
  objSel.y0 = objSel.y1 = e.clientY - r.top;
  selRect.style.cssText = `display:block;left:${objSel.x0}px;top:${objSel.y0}px;width:0;height:0;border-color:#2288ff;background:rgba(34,136,255,.07)`;
}, true);

window.addEventListener('mousemove', e => {
  if (!objSelMode || !objSel.active) return;
  const r = canvas.getBoundingClientRect();
  objSel.x1 = e.clientX - r.left;
  objSel.y1 = e.clientY - r.top;
  const x=Math.min(objSel.x0,objSel.x1), y=Math.min(objSel.y0,objSel.y1);
  const w=Math.abs(objSel.x1-objSel.x0), h=Math.abs(objSel.y1-objSel.y0);
  selRect.style.left=x+'px'; selRect.style.top=y+'px';
  selRect.style.width=w+'px'; selRect.style.height=h+'px';
}, true);

window.addEventListener('mouseup', e => {
  if (!objSelMode || !objSel.active) return;
  objSel.active = false;
  selRect.style.display = 'none';

  const px0=Math.min(objSel.x0,objSel.x1), px1=Math.max(objSel.x0,objSel.x1);
  const py0=Math.min(objSel.y0,objSel.y1), py1=Math.max(objSel.y0,objSel.y1);

  if (px1-px0 < 3 && py1-py0 < 3) {
    // Click (not drag): point-select — find nearest primitive centroid
    const cpx=(px0+px1)/2, cpy=(py0+py1)/2;
    const g = canvasToGerber(cpx, cpy);
    let best=null, bestD=Infinity;
    const clickLayers = renderer.selectedLayer
      ? [renderer.selectedLayer]
      : renderer.layers.filter(l=>l.visible);
    for (const layer of clickLayers) {
      if (!layer.visible) continue;
      for (const prim of layer.primitives) {
        if (prim.polarity !== 'D') continue;
        const bb = renderer.primitiveBounds(prim);
        if (!bb) continue;
        const cx=(bb.minX+bb.maxX)/2, cy=(bb.minY+bb.maxY)/2;
        const d=Math.hypot(g.x-cx, g.y-cy);
        if (d<bestD) { bestD=d; best={prim,layer}; }
      }
    }
    // Accept if within 5mm or 20px equivalent
    const thresh = 20/renderer.scale;
    if (best && bestD < thresh) {
      const already = selectedPrims.findIndex(s=>s.prim===best.prim);
      if (e.shiftKey) {
        // Shift-click: toggle
        if (already>=0) selectedPrims.splice(already,1);
        else selectedPrims.push(best);
      } else {
        if (already>=0 && selectedPrims.length===1) selectedPrims=[];
        else selectedPrims=[best];
      }
    } else if (!e.shiftKey) {
      selectedPrims=[];
    }
  } else {
    // Rubber-band: convert to Gerber coords
    const t=renderer;
    const gx0=(px0-t.tx)/t.scale, gy0=(t.ty-py1)/t.scale;
    const gx1=(px1-t.tx)/t.scale, gy1=(t.ty-py0)/t.scale;
    const found = selectInRect(gx0,gy0,gx1,gy1);
    if (e.shiftKey) {
      // Add to existing selection
      for (const f of found) {
        if (!selectedPrims.find(s=>s.prim===f.prim)) selectedPrims.push(f);
      }
    } else {
      selectedPrims = found;
    }
  }
  renderMeasOverlay();
  if (selectedPrims.length)
    showToast(`${selectedPrims.length} object${selectedPrims.length>1?'s':''} selected`);
}, true);

// ── Deep clone a primitive ────────────────────────────────────────────────────
function clonePrim(p) {
  const c = { ...p };
  if (p.ap)   c.ap   = { ...p.ap, params: [...p.ap.params] };
  if (p.path) c.path = p.path.map(pt=>({...pt}));
  return c;
}

// ── Mark a layer as edited ────────────────────────────────────────────────────
function markDirty(layer) {
  if (!layer.dirty) {
    layer.dirty = true;
    updateLayerList();
  }
  // Highlight save button whenever any layer is dirty
  const anyDirty = layers.some(l => l.dirty);
  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) saveBtn.classList.toggle('active', anyDirty);
}

// ── Copy ──────────────────────────────────────────────────────────────────────
function doCopy() {
  if (!selectedPrims.length) { showToast('Nothing selected'); return; }
  clipboard = selectedPrims.map(({prim, layer}) => ({
    prim: clonePrim(prim),
    srcLayerName: layer.name
  }));
  pasteOffset = 0;
  showToast(`Copied ${clipboard.length} object${clipboard.length>1?'s':''}`);
}

// ── Cut ───────────────────────────────────────────────────────────────────────
function doCut() {
  if (!selectedPrims.length) { showToast('Nothing selected'); return; }
  clipboard = selectedPrims.map(({prim, layer}) => ({
    prim: clonePrim(prim),
    srcLayerName: layer.name
  }));
  pasteOffset = 0;
  // Remove from source layers
  for (const { prim, layer } of selectedPrims) {
    const idx = layer.primitives.indexOf(prim);
    if (idx >= 0) { layer.primitives.splice(idx, 1); markDirty(layer); }
  }
  selectedPrims = [];
  renderer.render();
  renderMeasOverlay();
  showToast(`Cut ${clipboard.length} object${clipboard.length>1?'s':''}`);
}

// ── Paste ─────────────────────────────────────────────────────────────────────
// Compute the centroid of the clipboard items
function clipboardCentroid() {
  let sx=0, sy=0, n=0;
  for (const { prim } of clipboard) {
    const bb = renderer.primitiveBounds(prim);
    if (!bb) continue;
    sx += (bb.minX+bb.maxX)/2; sy += (bb.minY+bb.maxY)/2; n++;
  }
  return n ? { x:sx/n, y:sy/n } : { x:0, y:0 };
}

// Offset a cloned prim by (dx,dy)
function offsetPrim(prim, dx, dy) {
  const c = clonePrim(prim);
  if (c.kind==='flash')  { c.x+=dx; c.y+=dy; }
  if (c.kind==='line')   { c.x1+=dx;c.y1+=dy;c.x2+=dx;c.y2+=dy; }
  if (c.kind==='arc')    { c.x1+=dx;c.y1+=dy;c.x2+=dx;c.y2+=dy;c.cx+=dx;c.cy+=dy; }
  if (c.kind==='region') { c.path=c.path.map(pt=>({x:pt.x+dx,y:pt.y+dy})); }
  return c;
}

function enterPasteMode() {
  if (!clipboard.length) { showToast('Clipboard empty'); return; }
  pasteMode   = true;
  pasteCursor = null;
  pasteGhosts = [];
  pasteBtn.classList.add('active');
  // Use a custom SVG crosshair cursor that's always visible in Chrome/Windows
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><line x1='16' y1='0' x2='16' y2='32' stroke='%23ff9900' stroke-width='2'/><line x1='0' y1='16' x2='32' y2='16' stroke='%23ff9900' stroke-width='2'/><circle cx='16' cy='16' r='3' fill='none' stroke='%23ff9900' stroke-width='1.5'/></svg>`;
  canvas.style.cursor = `url("data:image/svg+xml,${svg}") 16 16, crosshair`;
  showToast('Move mouse to position — click or Enter to place, Esc to cancel');
  renderMeasOverlay();
}

function exitPasteMode() {
  pasteMode = false;
  pasteGhosts = [];
  pasteBtn.classList.remove('active');
  canvas.style.cursor = objSelMode ? 'crosshair' : 'grab';
  renderMeasOverlay();
}
function commitPaste(gx, gy) {
  if (!clipboard.length) return;
  const target = renderer.selectedLayer || renderer.layers.find(l=>l.visible);
  if (!target) { showToast('No target layer — select a layer first'); return; }

  const origin = clipboardCentroid();
  const dx = gx - origin.x, dy = gy - origin.y;

  const pasted = [];
  for (const { prim } of clipboard) {
    const c = offsetPrim(prim, dx, dy);
    target.primitives.push(c);
    pasted.push({ prim:c, layer:target });
  }

  selectedPrims = pasted;
  markDirty(target);
  exitPasteMode();
  renderer.render();
  startMarchingAnts();
  showToast(`Pasted ${pasted.length} object${pasted.length>1?'s':''} onto "${target.name}"`);
}

function doPaste() {
  if (!clipboard.length) { showToast('Clipboard empty'); return; }
  enterPasteMode();
}

// ── Button wiring ─────────────────────────────────────────────────────────────
copyBtn.addEventListener('click',  doCopy);
cutBtn.addEventListener('click',   doCut);
pasteBtn.addEventListener('click', doPaste);

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Don't fire if focus is in an input
  if (e.target.tagName === 'INPUT') return;
  if (e.key==='Escape' && pasteMode) { exitPasteMode(); return; }
  if (e.key==='Enter'  && pasteMode && pasteCursor) { commitPaste(pasteCursor.x, pasteCursor.y); return; }
  if (e.key==='Escape' && objSelMode) { exitObjSelMode(); clearObjSelection(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='a' && objSelMode) {
    e.preventDefault();
    selectedPrims = [];
    const allLayers = renderer.selectedLayer
      ? [renderer.selectedLayer]
      : renderer.layers.filter(l=>l.visible);
    for (const layer of allLayers) {
      if (!layer.visible) continue;
      for (const prim of layer.primitives) {
        if (prim.polarity==='D') selectedPrims.push({prim,layer});
      }
    }
    renderMeasOverlay();
    showToast(`${selectedPrims.length} objects selected`);
    return;
  }
  if ((e.ctrlKey||e.metaKey) && e.key==='c') { e.preventDefault(); doCopy();  return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='x') { e.preventDefault(); doCut();   return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='v') { e.preventDefault(); doPaste(); return; }
  if ((e.key==='Delete'||e.key==='Backspace') && objSelMode && selectedPrims.length) {
    e.preventDefault();
    for (const {prim,layer} of selectedPrims) {
      const idx=layer.primitives.indexOf(prim);
      if(idx>=0) { layer.primitives.splice(idx,1); markDirty(layer); }
    }
    selectedPrims=[];
    renderer.render(); renderMeasOverlay();
    showToast('Deleted');
  }
});

// ══════════════════════════════════════════════════════════════════════════════
//  GERBER WRITER  — reconstructs RS-274X from in-memory primitives
// ══════════════════════════════════════════════════════════════════════════════

function writeGerber(layer) {
  // Format: FSLAX46Y46 — 4 integer digits, 6 decimal digits (sub-nanometre resolution)
  const INT = 4, DEC = 6, SCALE = Math.pow(10, DEC);

  function fmtCoord(v) {
    // Round to DEC decimal places, encode as integer string (no decimal point)
    const raw = Math.round(v * SCALE);
    return raw.toString();
  }
  function fmtI(v) { return fmtCoord(v); }

  // Collect unique apertures from primitives
  // Key: canonical description string → aperture id
  const apMap = new Map();   // description → {id, def}
  let nextAp = 10;

  function apKey(ap) {
    const pr = ap.params;
    if (ap.type === 'C')       return `C,${pr[0].toFixed(4)}${pr[1]?'X'+pr[1].toFixed(4):''}`;
    if (ap.type === 'R')       return `R,${pr[0].toFixed(4)}X${(pr[1]!==undefined?pr[1]:pr[0]).toFixed(4)}${pr[2]?'X'+pr[2].toFixed(4):''}`;
    if (ap.type === 'O')       return `O,${pr[0].toFixed(4)}X${(pr[1]!==undefined?pr[1]:pr[0]).toFixed(4)}`;
    if (ap.type === 'S')       return `R,${pr[0].toFixed(4)}X${pr[0].toFixed(4)}`;
    if (ap.type === 'P')       return `P,${pr[0].toFixed(4)}X${Math.round(pr[1]||6)}X${(pr[2]||0).toFixed(4)}`;
    if (ap.type === 'THERMAL') return `C,${pr[0].toFixed(4)}`;  // export outer as circle
    return `C,${(pr[0]||0.1).toFixed(4)}`;
  }
  function apDef(ap, id) {
    const pr = ap.params;
    if (ap.type === 'C')  return `%ADD${id}C,${pr[0].toFixed(4)}${pr[1]?'X'+pr[1].toFixed(4):''}*%`;
    if (ap.type === 'R')  return `%ADD${id}R,${pr[0].toFixed(4)}X${(pr[1]!==undefined?pr[1]:pr[0]).toFixed(4)}${pr[2]?'X'+pr[2].toFixed(4):''}*%`;
    if (ap.type === 'O')  return `%ADD${id}O,${pr[0].toFixed(4)}X${(pr[1]!==undefined?pr[1]:pr[0]).toFixed(4)}*%`;
    if (ap.type === 'S')  return `%ADD${id}R,${pr[0].toFixed(4)}X${pr[0].toFixed(4)}*%`;
    if (ap.type === 'P')  return `%ADD${id}P,${pr[0].toFixed(4)}X${Math.round(pr[1]||6)}X${(pr[2]||0).toFixed(4)}*%`;
    if (ap.type === 'THERMAL') return `%ADD${id}C,${pr[0].toFixed(4)}*%`;
    return `%ADD${id}C,${(pr[0]||0.1).toFixed(4)}*%`;
  }

  function getAp(ap) {
    const k = apKey(ap);
    if (!apMap.has(k)) apMap.set(k, { id: nextAp++, def: apDef(ap, nextAp - 1) });
    return apMap.get(k);
  }

  // Two-pass: collect apertures, then emit data
  // Pass 1: register all apertures
  for (const p of layer.primitives) {
    if (p.kind === 'flash') getAp(p.ap);
    else if (p.kind === 'line' || p.kind === 'arc') getAp(p.ap || { type:'C', params:[p.w||0.05] });
  }

  // Build output
  const lines = [];
  lines.push('G04 PCBView exported Gerber*');
  lines.push(`G04 Layer: ${layer.name}*`);
  lines.push(`G04 Generated: ${new Date().toISOString()}*`);
  lines.push('%FSLAX46Y46*%');
  lines.push('%MOMM*%');
  lines.push('%LPD*%');

  // Aperture definitions
  for (const { def } of apMap.values()) lines.push(def);

  lines.push('G01*'); // linear interpolation default

  let curApId = null;
  let curX = null, curY = null;
  let inRegion = false;

  function emitMove(x, y) {
    if (curX === x && curY === y) return;
    lines.push(`X${fmtCoord(x)}Y${fmtCoord(y)}D02*`);
    curX = x; curY = y;
  }

  function selectAp(apObj) {
    const { id } = getAp(apObj);
    if (curApId !== id) { lines.push(`D${id}*`); curApId = id; }
  }

  for (const p of layer.primitives) {
    if (p.polarity === 'C') {
      if (inRegion) { lines.push('D02*'); lines.push('G37*'); inRegion = false; }
      lines.push('%LPC*%');
    } else if (!inRegion) {
      lines.push('%LPD*%');
    }

    if (p.kind === 'flash') {
      selectAp(p.ap);
      emitMove(p.x, p.y);
      lines.push('D03*');
      curX = p.x; curY = p.y;

    } else if (p.kind === 'line') {
      const lineAp = p.ap || { type:'C', params:[p.w||0.05] };
      selectAp(lineAp);
      lines.push('G01*');
      emitMove(p.x1, p.y1);
      lines.push(`X${fmtCoord(p.x2)}Y${fmtCoord(p.y2)}D01*`);
      curX = p.x2; curY = p.y2;

    } else if (p.kind === 'arc') {
      const arcAp = p.ap || { type:'C', params:[p.w||0.05] };
      selectAp(arcAp);
      lines.push(p.cw ? 'G02*' : 'G03*');
      lines.push('G75*'); // multi-quadrant
      emitMove(p.x1, p.y1);
      const I = p.cx - p.x1, J = p.cy - p.y1;
      // Full circle check
      const dxe = p.x2 - p.x1, dye = p.y2 - p.y1;
      if (dxe*dxe + dye*dye < 1e-10) {
        // Full circle: end = start
        lines.push(`X${fmtCoord(p.x1)}Y${fmtCoord(p.y1)}I${fmtI(I)}J${fmtI(J)}D01*`);
      } else {
        lines.push(`X${fmtCoord(p.x2)}Y${fmtCoord(p.y2)}I${fmtI(I)}J${fmtI(J)}D01*`);
      }
      curX = p.x2; curY = p.y2;
      lines.push('G01*'); // restore linear

    } else if (p.kind === 'region') {
      if (p.path.length < 3) continue;
      lines.push('G36*');
      lines.push('G01*');
      lines.push(`X${fmtCoord(p.path[0].x)}Y${fmtCoord(p.path[0].y)}D02*`);
      for (let k = 1; k < p.path.length; k++) {
        lines.push(`X${fmtCoord(p.path[k].x)}Y${fmtCoord(p.path[k].y)}D01*`);
      }
      // Close
      lines.push(`X${fmtCoord(p.path[0].x)}Y${fmtCoord(p.path[0].y)}D01*`);
      lines.push('D02*');
      lines.push('G37*');
      curX = p.path[0].x; curY = p.path[0].y;
    }
  }

  lines.push('M02*');
  return lines.join('\r\n');
}

// ── Save dirty layers ─────────────────────────────────────────────────────────
function saveDirtyLayers() {
  const dirty = layers.filter(l => l.dirty);
  if (!dirty.length) {
    showToast('No edited layers to save');
    return;
  }
  for (const layer of dirty) {
    const gerber = writeGerber(layer);
    const blob   = new Blob([gerber], { type: 'text/plain' });
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    // Suggest filename: original name with _edited suffix before extension
    const nameParts = layer.name.split('.');
    const ext = nameParts.pop();
    a.download = `${nameParts.join('.')}_edited.${ext}`;
    a.href = url;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  showToast(`Saved ${dirty.length} layer${dirty.length>1?'s':''}`);
}

document.getElementById('save-btn').addEventListener('click', saveDirtyLayers);

updateZoom(); updateStatus();
</script>
