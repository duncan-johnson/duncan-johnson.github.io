
<style>
  .calc-wrap { font-family: sans-serif; padding: 1rem 0; max-width: 580px; width: 100%; margin: 0 auto; }
  .section-title { font-size: 13px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
  .card { background: #fff; border: 1px solid #d0d0d0; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .options-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 0.5rem; }
  .opt-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  .opt-group label { font-size: 12px; color: #666; }
  select, input[type=number] { width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; padding: 6px 8px; font-size: 13px; background: #fff; color: #111; }
  .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 13px; color: #555; }
  .input-row { display: flex; align-items: center; gap: 6px; }
  .input-row input { flex: 1; min-width: 0; }
  .unit { font-size: 13px; color: #666; white-space: nowrap; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  button { cursor: pointer; border-radius: 6px; font-size: 13px; padding: 7px 14px; border: 1px solid #aac; }
  .btn-primary { background: #e8f0fe; color: #1a56db; border-color: #93b4f7; font-weight: 500; }
  .btn-primary:hover { background: #d0e2fd; }
  .btn-clear { background: #fff; color: #555; border-color: #ccc; }
  .btn-clear:hover { background: #f5f5f5; }
  .results-section { display: none; }
  .results-section.visible { display: block; }
  .ideal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
  .metric-card { background: #f5f5f5; border-radius: 8px; padding: 10px 12px; }
  .metric-label { font-size: 11px; color: #888; margin: 0 0 2px; }
  .metric-value { font-size: 15px; font-weight: 500; color: #111; margin: 0; word-break: break-all; }
  .real-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .real-table th { text-align: center; font-weight: 600; font-size: 12px; padding: 8px; border: 2px solid #999; background: #e8e8e8; color: #333; }
  .real-table th:first-child { text-align: left; }
  .real-table td { padding: 8px; border: 1px solid #bbb; color: #111; text-align: center; background: #fff; }
  .real-table td:first-child { font-weight: 600; text-align: left; background: #f0f0f0; color: #333; }
  .col-max { color: #c0392b !important; font-weight: 500; }
  .col-min { color: #27ae60 !important; font-weight: 500; }
  .err { font-size: 13px; color: #c0392b; padding: 8px 0; display: none; }
  .schematic { display: flex; justify-content: center; margin-bottom: 1rem; }
  .preferred-note { font-size: 12px; color: #666; padding: 6px 0 10px; display: none; }
  .preferred-val { font-weight: 500; color: #111; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  @media (prefers-color-scheme: dark) {
    .calc-wrap { color: #eee; }
    .card { background: #1e1e1e; border-color: #444; }
    .section-title, .opt-group label, .field label, .unit { color: #aaa; }
    select, input[type=number] { background: #2a2a2a; color: #eee; border-color: #555; }
    .btn-primary { background: #1a3a6e; color: #7eb0f7; border-color: #3a5a9e; }
    .btn-primary:hover { background: #1e4580; }
    .btn-clear { background: #2a2a2a; color: #bbb; border-color: #555; }
    .btn-clear:hover { background: #333; }
    .metric-card { background: #2a2a2a; }
    .metric-label { color: #888; }
    .metric-value { color: #eee; }
    .real-table th { background: #2e2e2e; color: #ccc; border-color: #555; }
    .real-table td { background: #1e1e1e; color: #ddd; border-color: #444; }
    .real-table td:first-child { background: #2a2a2a; color: #ccc; }
    .col-max { color: #e74c3c !important; }
    .col-min { color: #2ecc71 !important; }
    .preferred-note { color: #aaa; }
    .preferred-val { color: #eee; }
  }
</style>

<div class="calc-wrap">
  <h1>Duncan's Resistor Divider Calculator<h1>
  <h2 class="sr-only">Potential Divider Calculator</h2>

  <div class="schematic">
    <svg viewBox="0 0 180 260" width="140" height="210" xmlns="http://www.w3.org/2000/svg">
      <text x="130" y="28" font-size="13" fill="#333" font-family="sans-serif" font-weight="500">Vin</text>
      <line x1="90" y1="10" x2="90" y2="38" stroke="#444" stroke-width="2"/>
      <rect x="70" y="38" width="40" height="64" rx="8" fill="#D4A76A" stroke="#8B6914" stroke-width="1.5"/>
      <rect x="70" y="52" width="40" height="7" fill="#c0392b" opacity="0.9"/>
      <rect x="70" y="63" width="40" height="7" fill="#2c3e50" opacity="0.9"/>
      <rect x="70" y="74" width="40" height="7" fill="#f39c12" opacity="0.9"/>
      <rect x="70" y="88" width="7" height="7" fill="#c0c0c0" opacity="0.9"/>
      <text x="90" y="72" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="500">R1</text>
      <line x1="90" y1="102" x2="90" y2="128" stroke="#444" stroke-width="2"/>
      <line x1="40" y1="128" x2="150" y2="128" stroke="#444" stroke-width="1.5"/>
      <text x="155" y="132" font-size="13" fill="#333" font-family="sans-serif" font-weight="500">Vout</text>
      <rect x="70" y="128" width="40" height="64" rx="8" fill="#D4A76A" stroke="#8B6914" stroke-width="1.5"/>
      <rect x="70" y="142" width="40" height="7" fill="#27ae60" opacity="0.9"/>
      <rect x="70" y="153" width="40" height="7" fill="#8e44ad" opacity="0.9"/>
      <rect x="70" y="164" width="40" height="7" fill="#c0392b" opacity="0.9"/>
      <rect x="70" y="178" width="7" height="7" fill="#c0c0c0" opacity="0.9"/>
      <text x="90" y="162" font-size="12" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="500">R2</text>
      <line x1="90" y1="192" x2="90" y2="212" stroke="#444" stroke-width="2"/>
      <line x1="66" y1="212" x2="114" y2="212" stroke="#444" stroke-width="2.5"/>
      <line x1="73" y1="220" x2="107" y2="220" stroke="#444" stroke-width="2"/>
      <line x1="80" y1="228" x2="100" y2="228" stroke="#444" stroke-width="1.5"/>
      <line x1="35" y1="10" x2="90" y2="10" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="35" y1="10" x2="35" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="35" y1="128" x2="40" y2="128" stroke="#888" stroke-width="1"/>
    </svg>
  </div>

  <div class="card">
    <p class="section-title">Settings</p>
    <div class="options-row">
      <div class="opt-group"><label>Preferred value series</label><select id="eseries"><option value="E6">E6</option><option value="E12">E12</option><option value="E24" selected>E24</option><option value="E48">E48</option><option value="E96">E96</option></select></div>
      <div class="opt-group"><label>Resistor tolerance</label><select id="rtol"><option value="5">5%</option><option value="1" selected>1%</option><option value="0.5">0.5%</option><option value="0.1">0.1%</option></select></div>
      <div class="opt-group"><label>Fixed voltage</label><select id="fixedV"><option value="vin">Vin</option><option value="vout">Vout</option></select></div>
      <div class="opt-group"><label>Voltage tolerance</label><select id="vtol"><option value="5">5%</option><option value="1" selected>1%</option><option value="0.5">0.5%</option><option value="0">0%</option></select></div>
    </div>
  </div>

  <div class="card">
    <p class="section-title">Known values</p>
    <div class="inputs-grid">
      <div class="field"><label>Vin</label><div class="input-row"><input type="number" id="vin" placeholder="e.g. 12" step="any" min="0"><span class="unit">V</span></div></div>
      <div class="field"><label>Vout</label><div class="input-row"><input type="number" id="vout" placeholder="e.g. 5" step="any" min="0"><span class="unit">V</span></div></div>
      <div class="field"><label>R1</label><div class="input-row"><input type="number" id="r1" placeholder="e.g. 10" step="any" min="0"><span class="unit">kΩ</span></div></div>
      <div class="field"><label>R2</label><div class="input-row"><input type="number" id="r2" placeholder="e.g. 5" step="any" min="0"><span class="unit">kΩ</span></div></div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="calcVout()">Calculate Vout</button>
      <button class="btn-primary" onclick="calcR1()">Calculate R1</button>
      <button class="btn-primary" onclick="calcR2()">Calculate R2</button>
      <button class="btn-primary" onclick="calcR1R2()">Calculate R1 and R2</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="results-section card" id="results">
    <p class="section-title">Results</p>
    <div class="preferred-note" id="preferred-note"></div>
    <p style="font-size:13px;font-weight:500;color:#666;margin:0 0 8px;">Ideal values</p>
    <div class="ideal-grid" id="ideal-grid"></div>
    <p style="font-size:13px;font-weight:500;color:#666;margin:1rem 0 8px;">Real values (with tolerances)</p>
    <table class="real-table">
      <thead><tr><th></th><th class="col-max">Maximum</th><th>Typical</th><th class="col-min">Minimum</th></tr></thead>
      <tbody id="real-tbody"></tbody>
    </table>
  </div>
</div>

<script>
const E6=[1.0,1.5,2.2,3.3,4.7,6.8];
const E12=[1.0,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
const E24=[1.0,1.1,1.2,1.3,1.5,1.6,1.8,2.0,2.2,2.4,2.7,3.0,3.3,3.6,3.9,4.3,4.7,5.1,5.6,6.2,6.8,7.5,8.2,9.1];
const E48=[1.00,1.05,1.10,1.15,1.21,1.27,1.33,1.40,1.47,1.54,1.62,1.69,1.78,1.87,1.96,2.05,2.15,2.26,2.37,2.49,2.61,2.74,2.87,3.01,3.16,3.32,3.48,3.65,3.83,4.02,4.22,4.42,4.64,4.87,5.11,5.36,5.62,5.90,6.19,6.49,6.81,7.15,7.50,7.87,8.25,8.66,9.09,9.53];
const E96=[1.00,1.02,1.05,1.07,1.10,1.13,1.15,1.18,1.21,1.24,1.27,1.30,1.33,1.37,1.40,1.43,1.47,1.50,1.54,1.58,1.62,1.65,1.69,1.74,1.78,1.82,1.87,1.91,1.96,2.00,2.05,2.10,2.15,2.21,2.26,2.32,2.37,2.43,2.49,2.55,2.61,2.67,2.74,2.80,2.87,2.94,3.01,3.09,3.16,3.24,3.32,3.40,3.48,3.57,3.65,3.74,3.83,3.92,4.02,4.12,4.22,4.32,4.42,4.53,4.64,4.75,4.87,4.99,5.11,5.23,5.36,5.49,5.62,5.76,5.90,6.04,6.19,6.34,6.49,6.65,6.81,6.98,7.15,7.32,7.50,7.68,7.87,8.06,8.25,8.45,8.66,8.87,9.09,9.31,9.53,9.76];
const SERIES={E6,E12,E24,E48,E96};

function getESeries(){
  const base=SERIES[document.getElementById('eseries').value];
  const vals=[];
  for(let d=-1;d<=5;d++) for(const v of base) vals.push(parseFloat((v*Math.pow(10,d)).toPrecision(3)));
  return vals;
}
function showErr(msg){
  const e=document.getElementById('err');
  e.textContent=msg; e.style.display=msg?'block':'none';
  document.getElementById('results').classList.remove('visible');
}
function fmtR(kΩ){
  if(kΩ>=1000) return (kΩ/1000).toPrecision(4)+' MΩ';
  if(kΩ>=1) return kΩ.toPrecision(4)+' kΩ';
  return (kΩ*1000).toPrecision(4)+' Ω';
}
function fmtV(v){ return v.toPrecision(5)+' V'; }
function getVal(id){ const v=parseFloat(document.getElementById(id).value); return isNaN(v)?null:v; }
function setVal(id,val){ if(val!==null&&!isNaN(val)) document.getElementById(id).value=parseFloat(val.toPrecision(6)); }
function voutFromR(R1,R2,Vin){ return Vin*R2/(R1+R2); }

function showResults(vin,vout,r1,r2,prefNote){
  const rtol=parseFloat(document.getElementById('rtol').value)/100;
  const vtol=parseFloat(document.getElementById('vtol').value)/100;

  const pn=document.getElementById('preferred-note');
  if(prefNote){pn.innerHTML=prefNote;pn.style.display='block';}else pn.style.display='none';

  const ig=document.getElementById('ideal-grid');
  ig.innerHTML='';
  [{label:'Vin',value:fmtV(vin)},{label:'Vout',value:fmtV(vout)},{label:'R1',value:fmtR(r1)},{label:'R2',value:fmtR(r2)}]
    .forEach(m=>{ ig.innerHTML+=`<div class="metric-card"><p class="metric-label">${m.label}</p><p class="metric-value">${m.value}</p></div>`; });

  // Vin always has voltage tolerance applied regardless of which is "fixed"
  // "Fixed" only controls which voltage the user supplies as a known reference
  const vin_max = vin * (1 + vtol);
  const vin_typ = vin;
  const vin_min = vin * (1 - vtol);

  // Resistor extremes
  const r1_hi = r1 * (1 + rtol);  // higher R1 → lower Vout
  const r1_lo = r1 * (1 - rtol);  // lower  R1 → higher Vout
  const r2_hi = r2 * (1 + rtol);  // higher R2 → higher Vout
  const r2_lo = r2 * (1 - rtol);  // lower  R2 → lower Vout

  // Max Vout: highest Vin + lowest R1 + highest R2
  // Min Vout: lowest  Vin + highest R1 + lowest R2
  const vout_max = voutFromR(r1_lo, r2_hi, vin_max);
  const vout_typ = voutFromR(r1,    r2,    vin_typ);
  const vout_min = voutFromR(r1_hi, r2_lo, vin_min);

  const rows=[
    ['Vin',  fmtV(vin_max),  fmtV(vin_typ),  fmtV(vin_min)],
    ['Vout', fmtV(vout_max), fmtV(vout_typ), fmtV(vout_min)],
    ['R1',   fmtR(r1_lo),    fmtR(r1),       fmtR(r1_hi)],
    ['R2',   fmtR(r2_hi),    fmtR(r2),       fmtR(r2_lo)],
  ];

  document.getElementById('real-tbody').innerHTML=rows.map(r=>
    `<tr><td>${r[0]}</td><td class="col-max">${r[1]}</td><td>${r[2]}</td><td class="col-min">${r[3]}</td></tr>`
  ).join('');

  document.getElementById('results').classList.add('visible');
  document.getElementById('err').style.display='none';
}

function calcVout(){
  const vin=getVal('vin'),r1=getVal('r1'),r2=getVal('r2');
  if(vin===null||r1===null||r2===null) return showErr('Enter Vin, R1 and R2.');
  if(r1+r2===0) return showErr('R1 + R2 cannot be zero.');
  const vout=voutFromR(r1,r2,vin);
  setVal('vout',vout);
  showResults(vin,vout,r1,r2,null);
}
function calcR1(){
  const vin=getVal('vin'),vout=getVal('vout'),r2=getVal('r2');
  if(vin===null||vout===null||r2===null) return showErr('Enter Vin, Vout and R2.');
  if(vout>=vin) return showErr('Vout must be less than Vin.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const r1=r2*(vin-vout)/vout;
  setVal('r1',r1);
  showResults(vin,vout,r1,r2,null);
}
function calcR2(){
  const vin=getVal('vin'),vout=getVal('vout'),r1=getVal('r1');
  if(vin===null||vout===null||r1===null) return showErr('Enter Vin, Vout and R1.');
  if(vout>=vin) return showErr('Vout must be less than Vin.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const r2=r1*vout/(vin-vout);
  setVal('r2',r2);
  showResults(vin,vout,r1,r2,null);
}
function calcR1R2(){
  const vin=getVal('vin'),vout=getVal('vout');
  if(vin===null||vout===null) return showErr('Enter Vin and Vout.');
  if(vout>=vin) return showErr('Vout must be less than Vin.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const targetRatio=vout/vin;
  const vals=getESeries();
  let bestR1=null,bestR2=null,bestErr=Infinity;
  for(const r2 of vals) for(const r1 of vals){
    const err=Math.abs(r2/(r1+r2)-targetRatio);
    if(err<bestErr){bestErr=err;bestR1=r1;bestR2=r2;}
  }
  const actualVout=vin*bestR2/(bestR1+bestR2);
  const errPct=((actualVout-vout)/vout*100).toFixed(3);
  setVal('r1',bestR1); setVal('r2',bestR2);
  const series=document.getElementById('eseries').value;
  const note=`Best ${series} pair: <span class="preferred-val">R1 = ${fmtR(bestR1)}, R2 = ${fmtR(bestR2)}</span> → actual Vout = <span class="preferred-val">${actualVout.toPrecision(5)} V</span> (error: ${errPct}%)`;
  showResults(vin,actualVout,bestR1,bestR2,note);
}
function clearAll(){
  ['vin','vout','r1','r2'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('results').classList.remove('visible');
  document.getElementById('err').style.display='none';
  document.getElementById('preferred-note').style.display='none';
}
</script>
