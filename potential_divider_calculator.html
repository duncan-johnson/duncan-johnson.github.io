
<style>
  .calc-wrap { font-family: sans-serif; padding: 1rem 0; max-width: 620px; width: 100%; margin: 0 auto; }
  .page-header { text-align: center; margin-bottom: 1rem; }
  .page-title { font-size: 20px; font-weight: 600; color: #111; margin: 0 0 4px; }
  .page-author { font-size: 13px; color: #888; margin: 0; }
  .section-title { font-size: 13px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }

  .options-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 0.5rem; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  button { cursor: pointer; border-radius: 6px; font-size: 13px; padding: 7px 14px; border: 1px solid #aac; }

  .err-pct-good { color: #27ae60; font-weight: 500; }

  @media (prefers-color-scheme: dark) {

    .card { background: #1e1e1e; border-color: #444; }
    .section-title, .opt-group label, .field label, .unit { color: #aaa; }
    select, input[type=number] { background: #2a2a2a; color: #eee; border-color: #555; }
    .btn-primary { background: #1a3a6e; color: #7eb0f7; border-color: #3a5a9e; }
    .btn-primary:hover { background: #1e4580; }
    .btn-clear { background: #2a2a2a; color: #bbb; border-color: #555; }
    .btn-clear:hover { background: #333; }
    .metric-card { background: #2a2a2a; }
    .metric-label { color: #888; }
    .metric-value { color: #eee; }

    .real-table td, .top20-table td { background: #1e1e1e; color: #ddd; border-color: #444; }
    .real-table td:first-child { background: #2a2a2a; color: #ccc; }
    .top20-table tr:first-child td { background: #2e2800; }
    .col-max { color: #e74c3c !important; }
    .col-min { color: #2ecc71 !important; }
    .rank-badge { background: #444; color: #ccc; }
    .top20-table tr:first-child td .rank-badge { background: #b8860b; color: #ffe; }
  }
</style>

<div class="calc-wrap">

  </div>

  <div class="card">
    <p class="section-title">Settings</p>
    <div class="options-row">
      <div class="opt-group"><label>Preferred value series</label><select id="eseries"><option value="E6">E6</option><option value="E12">E12</option><option value="E24" selected>E24</option><option value="E48">E48</option><option value="E96">E96</option></select></div>
      <div class="opt-group"><label>Resistor tolerance</label><select id="rtol"><option value="5">5%</option><option value="1" selected>1%</option><option value="0.5">0.5%</option><option value="0.1">0.1%</option></select></div>
      <div class="opt-group"><label>Voltage tolerance</label><select id="vtol"><option value="5">5%</option><option value="1" selected>1%</option><option value="0.5">0.5%</option><option value="0">0%</option></select></div>
    </div>
  </div>

  <div class="card">
    <p class="section-title">Known values</p>
    <div class="inputs-grid">
      <div class="field"><label>Vin</label><div class="input-row"><input type="number" id="vin" placeholder="e.g. 12" step="any" min="0"><span class="unit">V</span></div></div>
      <div class="field"><label>Vout</label><div class="input-row"><input type="number" id="vout" placeholder="e.g. 5" step="any" min="0"><span class="unit">V</span></div></div>
      <div class="field"><label>R1</label><div class="input-row"><input type="number" id="r1" placeholder="e.g. 10" step="any" min="0"><span class="unit">kΩ</span></div></div>
      <div class="field"><label>R2</label><div class="input-row"><input type="number" id="r2" placeholder="e.g. 5" step="any" min="0"><span class="unit">kΩ</span></div></div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="calcVin()">Calculate Vin</button>
      <button class="btn-primary" onclick="calcVout()">Calculate Vout</button>
      <button class="btn-primary" onclick="calcR1()">Calculate R1</button>
      <button class="btn-primary" onclick="calcR2()">Calculate R2</button>
      <button class="btn-primary" onclick="calcR1R2()">Calculate R1 and R2</button>
      <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="results-section card" id="results">
    <p class="section-title">Results</p>
    <div class="ideal-grid" id="ideal-grid"></div>
    <p style="font-size:13px;font-weight:500;color:#666;margin:1rem 0 8px;">Real values (with tolerances)</p>
    <table class="real-table">
      <thead><tr><th></th><th class="col-min">Minimum</th><th>Typical</th><th class="col-max">Maximum</th></tr></thead>
      <tbody id="real-tbody"></tbody>
    </table>
  </div>

  <div class="results-section card" id="top20-section">
    <p class="section-title">Top 20 preferred value pairs</p>
    <table class="top20-table">
      <thead><tr><th>#</th><th>R1</th><th>R2</th><th>Vout (actual)</th><th>Error</th></tr></thead>
      <tbody id="top20-tbody"></tbody>
    </table>
  </div>

</div>

<script>
const E6=[1.0,1.5,2.2,3.3,4.7,6.8];
const E12=[1.0,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
const E24=[1.0,1.1,1.2,1.3,1.5,1.6,1.8,2.0,2.2,2.4,2.7,3.0,3.3,3.6,3.9,4.3,4.7,5.1,5.6,6.2,6.8,7.5,8.2,9.1];
const E48=[1.00,1.05,1.10,1.15,1.21,1.27,1.33,1.40,1.47,1.54,1.62,1.69,1.78,1.87,1.96,2.05,2.15,2.26,2.37,2.49,2.61,2.74,2.87,3.01,3.16,3.32,3.48,3.65,3.83,4.02,4.22,4.42,4.64,4.87,5.11,5.36,5.62,5.90,6.19,6.49,6.81,7.15,7.50,7.87,8.25,8.66,9.09,9.53];
const E96=[1.00,1.02,1.05,1.07,1.10,1.13,1.15,1.18,1.21,1.24,1.27,1.30,1.33,1.37,1.40,1.43,1.47,1.50,1.54,1.58,1.62,1.65,1.69,1.74,1.78,1.82,1.87,1.91,1.96,2.00,2.05,2.10,2.15,2.21,2.26,2.32,2.37,2.43,2.49,2.55,2.61,2.67,2.74,2.80,2.87,2.94,3.01,3.09,3.16,3.24,3.32,3.40,3.48,3.57,3.65,3.74,3.83,3.92,4.02,4.12,4.22,4.32,4.42,4.53,4.64,4.75,4.87,4.99,5.11,5.23,5.36,5.49,5.62,5.76,5.90,6.04,6.19,6.34,6.49,6.65,6.81,6.98,7.15,7.32,7.50,7.68,7.87,8.06,8.25,8.45,8.66,8.87,9.09,9.31,9.53,9.76];
const SERIES={E6,E12,E24,E48,E96};

function getESeries(){
  const base=SERIES[document.getElementById('eseries').value];
  const vals=[];
  for(let d=-1;d<=5;d++) for(const v of base) vals.push(parseFloat((v*Math.pow(10,d)).toPrecision(3)));
  return vals;
}
function showErr(msg){
  const e=document.getElementById('err');
  e.textContent=msg; e.style.display=msg?'block':'none';
  document.getElementById('results').classList.remove('visible');
  document.getElementById('top20-section').classList.remove('visible');
}
function fmtR(kΩ){
  if(kΩ>=1000) return (kΩ/1000).toPrecision(4)+' MΩ';
  if(kΩ>=1) return kΩ.toPrecision(4)+' kΩ';
  return (kΩ*1000).toPrecision(4)+' Ω';
}
function fmtV(v){ return v.toPrecision(5)+' V'; }
function getVal(id){ const v=parseFloat(document.getElementById(id).value); return isNaN(v)?null:v; }
function setVal(id,val){ if(val!==null&&!isNaN(val)) document.getElementById(id).value=parseFloat(val.toPrecision(6)); }
function voutFromR(R1,R2,Vin){ return Vin*R2/(R1+R2); }
function vinFromR(Vout,R1,R2){ return Vout*(R1+R2)/R2; }

function isDecadeMultiple(r1a,r2a,r1b,r2b){
  const ratio1=r1b/r1a, ratio2=r2b/r2a;
  if(Math.abs(ratio1-ratio2)>1e-9) return false;
  if(Math.abs(ratio1-1)<1e-9) return false;
  const n=Math.log10(ratio1);
  return Math.abs(n-Math.round(n))<1e-9 && Math.round(n)!==0;
}

function buildTop20(vin,vout){
  const vals=getESeries();
  const candidates=[];
  for(const r2 of vals) for(const r1 of vals){
    const actualVout=voutFromR(r1,r2,vin);
    const signedErr=(actualVout-vout)/vout*100;
    const absErr=Math.abs(signedErr);
    candidates.push({r1,r2,actualVout,signedErr,absErr});
  }
  candidates.sort((a,b)=>a.absErr-b.absErr);
  const accepted=[];
  for(const c of candidates){
    const isDupe=accepted.some(a=>isDecadeMultiple(a.r1,a.r2,c.r1,c.r2));
    if(!isDupe) accepted.push(c);
    if(accepted.length>=20) break;
  }
  return accepted;
}

function errClass(absErr){
  if(absErr<0.5) return 'err-pct-good';
  if(absErr<2)   return 'err-pct-ok';
  return 'err-pct-bad';
}
function fmtErr(signedErr){
  const sign=signedErr>=0?'+':'−';
  return sign+Math.abs(signedErr).toFixed(4)+'%';
}

function showResults(vin,vout,r1,r2,showTop20){
  const rtol=parseFloat(document.getElementById('rtol').value)/100;
  const vtol=parseFloat(document.getElementById('vtol').value)/100;

  const ig=document.getElementById('ideal-grid');
  ig.innerHTML='';
  [{label:'Vin',value:fmtV(vin)},{label:'Vout',value:fmtV(vout)},{label:'R1',value:fmtR(r1)},{label:'R2',value:fmtR(r2)}]
    .forEach(m=>{ig.innerHTML+=`<div class="metric-card"><p class="metric-label">${m.label}</p><p class="metric-value">${m.value}</p></div>`;});

  const vin_min=vin*(1-vtol),vin_typ=vin,vin_max=vin*(1+vtol);
  const r1_hi=r1*(1+rtol),r1_lo=r1*(1-rtol);
  const r2_hi=r2*(1+rtol),r2_lo=r2*(1-rtol);
  const vout_min=voutFromR(r1_hi,r2_lo,vin_min);
  const vout_typ=voutFromR(r1,r2,vin_typ);
  const vout_max=voutFromR(r1_lo,r2_hi,vin_max);

  const rows=[
    ['Vin', fmtV(vin_min), fmtV(vin_typ), fmtV(vin_max)],
    ['Vout',fmtV(vout_min),fmtV(vout_typ),fmtV(vout_max)],
    ['R1',  fmtR(r1_hi),   fmtR(r1),      fmtR(r1_lo)],
    ['R2',  fmtR(r2_lo),   fmtR(r2),      fmtR(r2_hi)],
  ];
  document.getElementById('real-tbody').innerHTML=rows.map(r=>
    `<tr><td>${r[0]}</td><td class="col-min">${r[1]}</td><td>${r[2]}</td><td class="col-max">${r[3]}</td></tr>`
  ).join('');

  document.getElementById('results').classList.add('visible');
  document.getElementById('err').style.display='none';
  document.getElementById('top20-section').classList[showTop20?'add':'remove']('visible');
}

function calcVin(){
  const vout=getVal('vout'),r1=getVal('r1'),r2=getVal('r2');
  if(vout===null||r1===null||r2===null) return showErr('Enter Vout, R1 and R2.');
  if(r2===0) return showErr('R2 cannot be zero.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const vin=vinFromR(vout,r1,r2);
  setVal('vin',vin);
  showResults(vin,vout,r1,r2,false);
}
function calcVout(){
  const vin=getVal('vin'),r1=getVal('r1'),r2=getVal('r2');
  if(vin===null||r1===null||r2===null) return showErr('Enter Vin, R1 and R2.');
  if(r1+r2===0) return showErr('R1 + R2 cannot be zero.');
  const vout=voutFromR(r1,r2,vin);
  setVal('vout',vout);
  showResults(vin,vout,r1,r2,false);
}
function calcR1(){
  const vin=getVal('vin'),vout=getVal('vout'),r2=getVal('r2');
  if(vin===null||vout===null||r2===null) return showErr('Enter Vin, Vout and R2.');
  if(vout>=vin) return showErr('Vout must be less than Vin.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const r1=r2*(vin-vout)/vout;
  setVal('r1',r1);
  showResults(vin,vout,r1,r2,false);
}
function calcR2(){
  const vin=getVal('vin'),vout=getVal('vout'),r1=getVal('r1');
  if(vin===null||vout===null||r1===null) return showErr('Enter Vin, Vout and R1.');
  if(vout>=vin) return showErr('Vout must be less than Vin.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const r2=r1*vout/(vin-vout);
  setVal('r2',r2);
  showResults(vin,vout,r1,r2,false);
}
function calcR1R2(){
  const vin=getVal('vin'),vout=getVal('vout');
  if(vin===null||vout===null) return showErr('Enter Vin and Vout.');
  if(vout>=vin) return showErr('Vout must be less than Vin.');
  if(vout<=0) return showErr('Vout must be greater than 0.');
  const top20=buildTop20(vin,vout);
  const best=top20[0];
  setVal('r1',best.r1); setVal('r2',best.r2);
  document.getElementById('top20-tbody').innerHTML=top20.map((c,i)=>
    `<tr><td><span class="rank-badge">${i+1}</span></td><td>${fmtR(c.r1)}</td><td>${fmtR(c.r2)}</td><td>${fmtV(c.actualVout)}</td><td class="${errClass(c.absErr)}">${fmtErr(c.signedErr)}</td></tr>`
  ).join('');
  showResults(vin,best.actualVout,best.r1,best.r2,true);
}
function clearAll(){
  ['vin','vout','r1','r2'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('results').classList.remove('visible');
  document.getElementById('top20-section').classList.remove('visible');
  document.getElementById('err').style.display='none';
}
</script>
