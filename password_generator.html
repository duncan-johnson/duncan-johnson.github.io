<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator - Duncan Johnson</title>
<style>
  :root {
    --bg: #f2f4f7;
    --panel: #ffffff;
    --border: #dde1e8;
    --text: #1b1e24;
    --muted: #6b7280;
    --accent: #4f8cff;
    --accent-hover: #3b73e0;
    --mono: 'Consolas', 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 4px 16px rgba(20, 24, 34, 0.06);
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 2px 0;
  }
  .byline {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 22px 0;
  }
  .output-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #password {
    flex: 1;
    font-family: var(--mono);
    font-size: 1.05rem;
    letter-spacing: 0.5px;
    padding: 12px 14px;
    background: #f6f7f9;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    overflow-x: auto;
    white-space: nowrap;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  .icon-btn {
    width: 44px;
    flex-shrink: 0;
    background: #eef0f4;
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 1.1rem;
  }
  .icon-btn:hover { background: #e2e5eb; }
  .icon-btn.copied { background: #22a35e; border-color: #22a35e; color: #fff; }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .setting label { font-size: 0.9rem; }
  .setting .val { color: var(--accent); font-family: var(--mono); }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .toggles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    margin: 18px 0 22px 0;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .toggle input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }

  .generate-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
  }
  .generate-btn:hover { background: var(--accent-hover); }

  .warning {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #e0a95e;
    min-height: 1em;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Password Generator</h1>
  <p class="byline">Duncan Johnson</p>

  <div class="output-row">
    <div id="password">••••••••••••</div>
    <button class="icon-btn" id="refreshBtn" title="Generate new password">&#8635;</button>
    <button class="icon-btn" id="copyBtn" title="Copy to clipboard">&#128203;</button>
  </div>

  <div class="setting">
    <label for="length">Length</label>
    <span class="val" id="lengthVal">14</span>
  </div>
  <input type="range" id="length" min="6" max="20" value="14">

  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
    <label class="toggle"><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
    <label class="toggle"><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
    <label class="toggle"><input type="checkbox" id="special" checked> Special (!@#$...)</label>
  </div>

  <button class="generate-btn" id="generateBtn">Generate Password</button>
  <div class="warning" id="warning"></div>
</div>

<script>
  const lengthSlider = document.getElementById('length');
  const lengthVal = document.getElementById('lengthVal');
  const lowerCb = document.getElementById('lower');
  const upperCb = document.getElementById('upper');
  const numbersCb = document.getElementById('numbers');
  const specialCb = document.getElementById('special');
  const passwordEl = document.getElementById('password');
  const warningEl = document.getElementById('warning');
  const copyBtn = document.getElementById('copyBtn');

  const CHARSETS = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    numbers: '0123456789',
    special: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  function getRandomInt(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function generatePassword() {
    const length = parseInt(lengthSlider.value, 10);
    const active = [];
    if (lowerCb.checked) active.push(CHARSETS.lower);
    if (upperCb.checked) active.push(CHARSETS.upper);
    if (numbersCb.checked) active.push(CHARSETS.numbers);
    if (specialCb.checked) active.push(CHARSETS.special);

    if (active.length === 0) {
      warningEl.textContent = 'Select at least one character type.';
      passwordEl.textContent = '—';
      return;
    }
    warningEl.textContent = '';

    // Ensure at least one character from each selected set
    let passwordChars = active.map(set => set[getRandomInt(set.length)]);

    const allChars = active.join('');
    while (passwordChars.length < length) {
      passwordChars.push(allChars[getRandomInt(allChars.length)]);
    }

    // Shuffle (Fisher-Yates) using crypto random
    for (let i = passwordChars.length - 1; i > 0; i--) {
      const j = getRandomInt(i + 1);
      [passwordChars[i], passwordChars[j]] = [passwordChars[j], passwordChars[i]];
    }

    passwordChars = passwordChars.slice(0, length);
    passwordEl.textContent = passwordChars.join('');
  }

  lengthSlider.addEventListener('input', () => {
    lengthVal.textContent = lengthSlider.value;
    generatePassword();
  });
  [lowerCb, upperCb, numbersCb, specialCb].forEach(cb =>
    cb.addEventListener('change', generatePassword)
  );
  document.getElementById('refreshBtn').addEventListener('click', generatePassword);
  document.getElementById('generateBtn').addEventListener('click', generatePassword);

  copyBtn.addEventListener('click', async () => {
    const text = passwordEl.textContent;
    if (!text || text === '—') return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = '&#10003;';
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = '&#128203;';
    }, 1200);
  });

  // Initial password
  generatePassword();
</script>

</body>
</html>
